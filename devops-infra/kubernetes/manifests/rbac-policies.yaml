apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-readonly
  namespace: fashion-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-readonly
  namespace: fashion-shop
rules:
- apiGroups: [""]
  resources: ["pods","pods/log","events","services"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","replicasets"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-readonly
  namespace: fashion-shop
subjects:
- kind: ServiceAccount
  name: ai-sre-readonly
  namespace: fashion-shop
roleRef:
  kind: Role
  name: ai-sre-readonly
  apiGroup: rbac.authorization.k8s.io
