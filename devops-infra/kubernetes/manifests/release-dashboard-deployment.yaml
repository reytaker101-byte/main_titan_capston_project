apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-dashboard
  namespace: release-dashboard
  labels:
    app: release-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-dashboard
  template:
    metadata:
      labels:
        app: release-dashboard
    spec:
      containers:
        - name: release-dashboard
          image: asia-southeast1-docker.pkg.dev/project-361c9ab3-160b-49e3-915/main-titan-capston-project-artifactory-repo/dev/release-dashboard:v1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
