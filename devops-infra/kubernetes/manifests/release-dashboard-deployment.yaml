apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-dashboard
  namespace: release-dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: release-dashboard-readonly
rules:

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: release-dashboard-readonly

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: release-dashboard-readonly

subjects:
  - kind: ServiceAccount
    name: release-dashboard
    namespace: release-dashboard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-dashboard
  namespace: release-dashboard

  labels:
    app: release-dashboard

spec:

  replicas: 1

  selector:
    matchLabels:
      app: release-dashboard

  template:

    metadata:
      labels:
        app: release-dashboard

    spec:

      serviceAccountName: release-dashboard

      containers:

        - name: release-dashboard

          image: asia-southeast1-docker.pkg.dev/project-361c9ab3-160b-49e3-915/main-titan-capston-project-artifactory-repo/dev/release-dashboard:__IMAGE_TAG__

          imagePullPolicy: Always

          ports:

            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:

            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: release-dashboard
  namespace: release-dashboard

spec:

  type: LoadBalancer

  selector:
    app: release-dashboard

  ports:

    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
