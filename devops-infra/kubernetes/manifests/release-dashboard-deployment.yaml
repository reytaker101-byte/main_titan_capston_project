apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: release-dashboard-readonly
rules:

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch

