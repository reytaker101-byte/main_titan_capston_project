apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-blue
  namespace: fashion-shop
  labels:
    app: order-service
    color: blue
spec:
  replicas: 0
  selector:
    matchLabels:
      app: order-service
      color: blue
  template:
    metadata:
      labels:
        app: order-service
        color: blue
    spec:
      containers:
      - name: order-service
        image: ghcr.io/example/order-service:v1.4.0
        ports:
        - containerPort: 8003
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
