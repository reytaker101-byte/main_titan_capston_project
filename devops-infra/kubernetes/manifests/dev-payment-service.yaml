apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ai-sre-dev
  labels:
    app: payment-service
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      environment: dev
  template:
    metadata:
      labels:
        app: payment-service
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: payment-service
          image: asia-southeast1-docker.pkg.dev/project-361c9ab3-160b-49e3-915/main-titan-capston-project-artifactory-repo/dev/payment-service:v1.1.0
          ports:
            - name: metrics
              containerPort: 8004
          readinessProbe:
            httpGet:
              path: /health
              port: 8004

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ai-sre-dev
spec:
  type: LoadBalancer
  selector:
    app: payment-service
    environment: dev
  ports:
    - port: 8004
      targetPort: 8004
