apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-blue
  namespace: fashion-shop
  labels:
    app: payment-service
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
      color: blue
  template:
    metadata:
      labels:
        app: payment-service
        color: blue
    spec:
      containers:
      - name: payment-service
        image: ghcr.io/example/payment-service:v1.4.0
        ports:
        - containerPort: 8004
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
