apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  namespace: fashion-shop
  labels:
    app: order-service
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      color: green
  template:
    metadata:
      labels:
        app: order-service
        color: green
    spec:
      containers:
      - name: order-service
        image: ghcr.io/example/order-service:v1.3.0
        ports:
        - containerPort: 8003
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
