apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service-blue
  namespace: fashion-shop
  labels:
    app: catalog-service
    color: blue
spec:
  replicas: 0
  selector:
    matchLabels:
      app: catalog-service
      color: blue
  template:
    metadata:
      labels:
        app: catalog-service
        color: blue
    spec:
      containers:
      - name: catalog-service
        image: ghcr.io/example/catalog-service:v1.4.0
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
