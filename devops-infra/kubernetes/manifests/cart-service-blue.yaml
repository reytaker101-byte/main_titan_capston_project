apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service-blue
  namespace: fashion-shop
  labels:
    app: cart-service
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
      color: blue
  template:
    metadata:
      labels:
        app: cart-service
        color: blue
    spec:
      containers:
      - name: cart-service
        image: ghcr.io/example/cart-service:v1.4.0
        ports:
        - containerPort: 8002
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
