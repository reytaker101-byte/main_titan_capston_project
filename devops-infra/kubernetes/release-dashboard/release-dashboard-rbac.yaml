apiVersion: v1
kind: ServiceAccount

metadata:
  name: release-dashboard
  namespace: release-dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: release-dashboard

rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - rollouts
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: release-dashboard

subjects:
  - kind: ServiceAccount
    name: release-dashboard
    namespace: release-dashboard

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: release-dashboard
