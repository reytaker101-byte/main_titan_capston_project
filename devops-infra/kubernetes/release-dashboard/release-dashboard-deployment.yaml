apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-dashboard
  template:
    metadata:
      labels:
        app: release-dashboard
    spec:
      serviceAccountName: release-dashboard
      containers:
        - name: release-dashboard
          image: asia-southeast1-docker.pkg.dev/project-361c9ab3-160b-49e3-915/main-titan-capston-project-artifactory-repo/release-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
