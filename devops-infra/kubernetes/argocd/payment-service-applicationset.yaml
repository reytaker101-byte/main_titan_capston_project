apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: payment-service
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: payment-dev
            valuesFile: values-dev.yaml

          - environment: stage
            namespace: payment-stage
            valuesFile: values-stage.yaml

          - environment: prod
            namespace: payment-prod
            valuesFile: values-prod.yaml

  template:
    metadata:
      name: 'payment-service-{{environment}}'

    spec:
      project: default

      source:
        repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
        targetRevision: main
        path: devops-infra/kubernetes/payment-service/helm

        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
