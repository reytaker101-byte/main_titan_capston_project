apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ai-sre-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
    targetRevision: main
    path: devops-infra/argocd

    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
