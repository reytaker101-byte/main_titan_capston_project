# ============================================================
# 1. ROOT ARGO CD APPLICATION
# Manages Argo CD resources from this directory
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sre-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
    targetRevision: main
    path: devops-infra/argocd
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# ============================================================
# 2. ARGO CD SERVER SERVICE
# Exposes Argo CD through a cloud LoadBalancer
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd

spec:
  type: LoadBalancer

  selector:
    app.kubernetes.io/name: argocd-server

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP

---
# ============================================================
# 3. PAYMENT SERVICE APPLICATIONSET
# Creates dev, stage and prod Applications
# Each environment uses its own complete values file.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payment-service
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: payment-dev
            valuesFile: values-dev.yaml

          - environment: stage
            namespace: payment-stage
            valuesFile: values-stage.yaml

          - environment: prod
            namespace: payment-prod
            valuesFile: values-prod.yaml

  template:
    metadata:
      name: 'payment-service-{{environment}}'

    spec:
      project: default

      source:
        repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
        targetRevision: main
        path: devops-infra/kubernetes/payment-service/helm

        helm:
          valueFiles:
            - '{{valuesFile}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

---
# ============================================================
# 4. RELEASE DASHBOARD APPLICATION
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-dashboard
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
    targetRevision: main
    path: devops-infra/kubernetes/release-dashboard

    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: release-dashboard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
