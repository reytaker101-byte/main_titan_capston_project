apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: payment-dev
spec:
  restartPolicy: Never
  containers:
    - name: memory-hog
      image: python:3.12-alpine
      command:
        - python
        - -c
        - "a=[]; exec('while True: a.append(bytearray(1024*1024))')"
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"
