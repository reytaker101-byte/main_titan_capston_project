apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-green
  namespace: payment-stage
  labels:
    app: payment-service
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
      color: green
  template:
    metadata:
      labels:
        app: payment-service
        color: green
    spec:
      containers:
        - name: payment-service
          image: asia-southeast1-docker.pkg.dev/project-361c9ab3-160b-49e3-915/main-titan-capston-project-artifactory-repo/dev/payment-service:v1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: APP_VERSION
              value: "v1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
