apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/reytaker101-byte/main_titan_capston_project.git
    targetRevision: main
    path: k8s/payment-service
  destination:
    server: https://kubernetes.default.svc
    namespace: payment-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
