name: 05 - Promote Stage Pilot to Stage Fleet

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image tag validated in Stage Pilot
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-blue-green.yaml
    with:
      namespace: payment-stage-fleet
      replicas: 1
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
