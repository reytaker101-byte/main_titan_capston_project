name: 03 - Deploy Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag in Artifact Registry
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-blue-green.yaml
    with:
      namespace: payment-dev
      replicas: 1
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
