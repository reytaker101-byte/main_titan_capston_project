name: 04 - Promote Dev to Stage Pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image tag already tested in Dev
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-blue-green.yaml
    with:
      namespace: payment-stage-pilot
      replicas: 1
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
