name: 03 - DEV Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "DEV image tag"
        required: true
        type: string

permissions:
  contents: write

jobs:

  deploy:
    name: Update DEV GitOps
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update DEV payment-service image
        run: |

          sed -i \
            "s/__IMAGE_TAG__/${IMAGE_TAG}/g" \
            devops-infra/kubernetes/manifests/dev-payment-service.yaml

      - name: Update release dashboard image
        run: |

          sed -i \
            "s/__IMAGE_TAG__/${IMAGE_TAG}/g" \
            devops-infra/kubernetes/manifests/release-dashboard-deployment.yaml

      - name: Commit GitOps change
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add devops-infra/kubernetes/manifests/

          git diff --cached --quiet || \
            git commit -m "deploy: DEV ${IMAGE_TAG}"

          git push
