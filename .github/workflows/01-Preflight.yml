name: 01 - Preflight, Deploy and Verify

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/01-Preflight.yml"
      - "devops-infra/argocd/**"
      - "devops-infra/kubernetes/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: preflight-deploy-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster
  ARGOCD_NAMESPACE: argocd
  DASHBOARD_NAMESPACE: release-dashboard

jobs:
  deploy:
    name: Bootstrap Argo CD, Deploy and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # VALIDATE GOOGLE CLOUD SECRETS
      # --------------------------------------------------

      - name: Validate required configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [[ -z "${GCP_PROJECT_ID:-}" ]]; then
            echo "::error::GCP_PROJECT_ID secret is missing."
            exit 1
          fi

          if [[ -z "${WIF_PROVIDER:-}" ]]; then
            echo "::error::GCP_WIF_PROVIDER secret is missing."
            exit 1
          fi

          if [[ -z "${GCP_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::GCP_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi

          echo "Required configuration is present."

      # --------------------------------------------------
      # GOOGLE CLOUD AUTHENTICATION
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list
          gcloud config get-value project

      # --------------------------------------------------
      # CONNECT TO GKE
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify GKE connectivity
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      # --------------------------------------------------
      # INSTALL ARGO CD
      # --------------------------------------------------

      - name: Install Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$ARGOCD_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply \
            -n "$ARGOCD_NAMESPACE" \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.9/manifests/install.yaml

          kubectl rollout status deployment/argocd-server \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/argocd-repo-server \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/argocd-applicationset-controller \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

      # --------------------------------------------------
      # INSTALL ARGO ROLLOUTS
      # --------------------------------------------------

      - name: Install Argo Rollouts controller
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml

          kubectl rollout status deployment/argo-rollouts \
            -n argo-rollouts \
            --timeout=300s

      # --------------------------------------------------
      # CREATE APPLICATION NAMESPACES
      # --------------------------------------------------

      - name: Create application namespaces
        shell: bash
        run: |
          set -euo pipefail

          for NS in \
            payment-dev \
            payment-stage \
            payment-prod \
            release-dashboard
          do
            kubectl create namespace "$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      # --------------------------------------------------
      # APPLY ARGO CD ROOT APPLICATION
      # --------------------------------------------------

      - name: Apply Argo CD root application
        shell: bash
        run: |
          set -euo pipefail

          test -f devops-infra/argocd/application.yaml

          kubectl apply \
            -f devops-infra/argocd/application.yaml

      # --------------------------------------------------
      # APPLY PAYMENT SERVICE APPLICATIONSET
      # --------------------------------------------------

      - name: Apply Payment Service ApplicationSet
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            devops-infra/kubernetes/argocd/payment-service-applicationset.yaml

          kubectl apply \
            -f devops-infra/kubernetes/argocd/payment-service-applicationset.yaml

      - name: Wait for Payment Service applications
        shell: bash
        run: |
          set -euo pipefail

          APPS=(
            payment-service-dev
            payment-service-stage
            payment-service-prod
          )

          for APP in "${APPS[@]}"; do
            echo "Waiting for $APP"

            FOUND=false

            for i in $(seq 1 30); do
              if kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
                FOUND=true
                break
              fi

              sleep 10
            done

            if [[ "$FOUND" != "true" ]]; then
              echo "::error::Application $APP was not created."
              exit 1
            fi

            kubectl get application "$APP" \
              -n "$ARGOCD_NAMESPACE"
          done

      # --------------------------------------------------
      # REQUEST ARGO CD SYNC
      # --------------------------------------------------

      - name: Sync Payment Service applications
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            echo "Requesting sync for $APP"

            kubectl patch application "$APP" \
              -n "$ARGOCD_NAMESPACE" \
              --type merge \
              -p '{"operation":{"sync":{}}}'

          done

      - name: Wait for Payment Service applications to sync
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            READY=false

            for i in $(seq 1 36); do
              SYNC_STATUS="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.sync.status}')"

              HEALTH_STATUS="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.health.status}')"

              echo "$APP: sync=$SYNC_STATUS health=$HEALTH_STATUS"

              if [[ "$SYNC_STATUS" == "Synced" && \
                    "$HEALTH_STATUS" == "Healthy" ]]; then
                READY=true
                break
              fi

              sleep 10
            done

            if [[ "$READY" != "true" ]]; then
              echo "::error::$APP did not reach Synced and Healthy."
              kubectl describe application "$APP" \
                -n "$ARGOCD_NAMESPACE" || true
              exit 1
            fi
          done

      # --------------------------------------------------
      # RELEASE DASHBOARD RESOURCES
      # --------------------------------------------------

      - name: Apply Release Dashboard resources
        shell: bash
        run: |
          set -euo pipefail

          DASHBOARD_DIR="devops-infra/kubernetes/release-dashboard"

          test -f "$DASHBOARD_DIR/release-dashboard-rbac.yaml"
          test -f "$DASHBOARD_DIR/release-dashboard-deployment.yaml"
          test -f "$DASHBOARD_DIR/release-dashboard-service.yaml"

          kubectl apply \
            -f "$DASHBOARD_DIR/release-dashboard-rbac.yaml" \
            -n "$DASHBOARD_NAMESPACE"

          kubectl apply \
            -f "$DASHBOARD_DIR/release-dashboard-deployment.yaml" \
            -n "$DASHBOARD_NAMESPACE"

          kubectl apply \
            -f "$DASHBOARD_DIR/release-dashboard-service.yaml" \
            -n "$DASHBOARD_NAMESPACE"

      # --------------------------------------------------
      # VERIFY RELEASE DASHBOARD
      # --------------------------------------------------

      - name: Verify Release Dashboard
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/release-dashboard \
            -n "$DASHBOARD_NAMESPACE" \
            --timeout=300s

          kubectl get deployments,pods,services \
            -n "$DASHBOARD_NAMESPACE" \
            -o wide

      # --------------------------------------------------
      # VERIFY PAYMENT SERVICE
      # --------------------------------------------------

      - name: Verify Payment Service workloads
        shell: bash
        run: |
          set -euo pipefail

          for NS in payment-dev payment-stage payment-prod; do
            echo "========================================"
            echo "NAMESPACE: $NS"
            echo "========================================"

            kubectl get rollouts -n "$NS" -o wide
            kubectl get pods -n "$NS" -o wide
            kubectl get services -n "$NS" -o wide
          done

      # --------------------------------------------------
      # FINAL STATUS REPORT
      # --------------------------------------------------

      - name: Final deployment status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ARGO CD APPLICATIONS"
          echo "========================================"

          kubectl get applications.argoproj.io \
            -n "$ARGOCD_NAMESPACE" -o wide || true

          echo "========================================"
          echo "ARGO ROLLOUTS CONTROLLER"
          echo "========================================"

          kubectl get pods \
            -n argo-rollouts -o wide || true

          echo "========================================"
          echo "RELEASE DASHBOARD"
          echo "========================================"

          kubectl get deployments,pods,services \
            -n "$DASHBOARD_NAMESPACE" -o wide || true

          for NS in payment-dev payment-stage payment-prod; do
            echo "========================================"
            echo "PAYMENT SERVICE: $NS"
            echo "========================================"

            kubectl get rollouts,pods,services \
              -n "$NS" -o wide || true
          done
