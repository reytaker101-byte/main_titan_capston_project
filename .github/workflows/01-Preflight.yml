name: 01 - Preflight, Deploy and Verify

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/01-Preflight.yml"
      - "devops-infra/argocd/**"
      - "devops-infra/kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: preflight-deploy-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster
  ARGOCD_NAMESPACE: argocd
  ROLLOUTS_NAMESPACE: argo-rollouts
  DASHBOARD_NAMESPACE: release-dashboard

jobs:
  deploy:
    name: Bootstrap, Deploy and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # VALIDATE SECRETS
      # --------------------------------------------------

      - name: Validate required secrets
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          [[ -n "$GCP_PROJECT_ID" ]] || {
            echo "::error::GCP_PROJECT_ID secret is missing."
            exit 1
          }

          [[ -n "$WIF_PROVIDER" ]] || {
            echo "::error::GCP_WIF_PROVIDER secret is missing."
            exit 1
          }

          [[ -n "$GCP_SERVICE_ACCOUNT" ]] || {
            echo "::error::GCP_SERVICE_ACCOUNT secret is missing."
            exit 1
          }

          echo "Required secrets are present."

      # --------------------------------------------------
      # GOOGLE CLOUD AUTHENTICATION
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud
        shell: bash
        run: |
          set -euo pipefail

          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list

      # --------------------------------------------------
      # GKE CONNECTION
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify cluster
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes

      # --------------------------------------------------
      # NAMESPACES
      # --------------------------------------------------

      - name: Create required namespaces
        shell: bash
        run: |
          set -euo pipefail

          for NS in \
            argocd \
            argo-rollouts \
            payment-dev \
            payment-stage \
            payment-prod \
            release-dashboard
          do
            kubectl create namespace "$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      # --------------------------------------------------
      # INSTALL ARGO CD
      # --------------------------------------------------

      - name: Install Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -n "$ARGOCD_NAMESPACE" \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.9/manifests/install.yaml

          kubectl rollout status deployment/argocd-server \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/argocd-repo-server \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/argocd-applicationset-controller \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

      # --------------------------------------------------
      # INSTALL ARGO ROLLOUTS
      # Install namespaced resources consistently.
      # --------------------------------------------------

      - name: Install Argo Rollouts controller
        shell: bash
        run: |
          set -euo pipefail

          ROLLOUTS_MANIFEST="/tmp/argo-rollouts-install.yaml"
          ROLLOUTS_MANIFEST_URL="https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml"

          echo "Downloading Argo Rollouts manifest..."

          curl --fail --silent --show-error --location \
            "$ROLLOUTS_MANIFEST_URL" \
            --output "$ROLLOUTS_MANIFEST"

          test -s "$ROLLOUTS_MANIFEST"

          echo "Updating manifest namespace references..."

          sed -i 's/namespace: default/namespace: argo-rollouts/g' \
            "$ROLLOUTS_MANIFEST"

          echo "Removing previous default-namespace controller..."

          kubectl delete deployment argo-rollouts \
            -n default \
            --ignore-not-found \
            --wait=true

          echo "Applying Argo Rollouts manifest..."

          kubectl apply \
            --server-side \
            --force-conflicts \
            -n "$ROLLOUTS_NAMESPACE" \
            -f "$ROLLOUTS_MANIFEST"

          echo "Waiting for Argo Rollouts CRDs..."

          kubectl wait \
            --for=condition=Established \
            crd/rollouts.argoproj.io \
            --timeout=180s

          kubectl wait \
            --for=condition=Established \
            crd/analysisruns.argoproj.io \
            --timeout=180s

          kubectl wait \
            --for=condition=Established \
            crd/analysistemplates.argoproj.io \
            --timeout=180s

          echo "Checking ServiceAccount..."

          kubectl get serviceaccount argo-rollouts \
            -n "$ROLLOUTS_NAMESPACE"

          echo "Checking controller deployment..."

          kubectl get deployment argo-rollouts \
            -n "$ROLLOUTS_NAMESPACE"

          echo "Waiting for controller readiness..."

          kubectl rollout status deployment/argo-rollouts \
            -n "$ROLLOUTS_NAMESPACE" \
            --timeout=300s

          echo "Verifying controller resources..."

          kubectl get deployments,pods,services \
            -n "$ROLLOUTS_NAMESPACE" -o wide

          echo "Controller logs..."

          kubectl logs \
            -n "$ROLLOUTS_NAMESPACE" \
            deployment/argo-rollouts \
            --tail=50

      # --------------------------------------------------
      # APPLY ROOT ARGO CD APPLICATION
      # --------------------------------------------------

      - name: Apply root Argo CD application
        shell: bash
        run: |
          set -euo pipefail

          APP_FILE="devops-infra/argocd/application.yaml"

          if [[ ! -f "$APP_FILE" ]]; then
            echo "::error::Root application manifest not found: $APP_FILE"
            exit 1
          fi

          echo "Validating root application manifest..."

          kubectl apply \
            --dry-run=client \
            -f "$APP_FILE"

          echo "Applying root Argo CD application..."

          if ! kubectl apply -f "$APP_FILE"; then
            echo "::error::Failed to apply root Argo CD application."

            echo "Root application manifest:"
            cat "$APP_FILE"

            echo "Existing Argo CD applications:"
            kubectl get applications \
              -n "$ARGOCD_NAMESPACE" -o wide || true

            echo "Argo CD controller logs:"
            kubectl logs \
              -n "$ARGOCD_NAMESPACE" \
              deployment/argocd-application-controller \
              --tail=100 || true

            exit 1
          fi

      # --------------------------------------------------
      # APPLY PAYMENT APPLICATIONSET
      # --------------------------------------------------

      - name: Apply Payment Service ApplicationSet
        shell: bash
        run: |
          set -euo pipefail

          APPSET="devops-infra/kubernetes/argocd/payment-service-applicationset.yaml"

          if [[ ! -f "$APPSET" ]]; then
            echo "::error::ApplicationSet manifest not found: $APPSET"
            exit 1
          fi

          kubectl apply \
            --dry-run=client \
            -f "$APPSET"

          kubectl apply -f "$APPSET"

      # --------------------------------------------------
      # WAIT FOR GENERATED APPLICATIONS
      # --------------------------------------------------

      - name: Wait for Payment Service applications
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            echo "Waiting for $APP..."

            FOUND=false

            for i in $(seq 1 30); do
              if kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
                FOUND=true
                break
              fi

              sleep 10
            done

            if [[ "$FOUND" != "true" ]]; then
              echo "::error::Application $APP was not created."

              kubectl get applications \
                -n "$ARGOCD_NAMESPACE" -o wide || true

              kubectl get applicationsets \
                -n "$ARGOCD_NAMESPACE" -o yaml || true

              kubectl logs \
                -n "$ARGOCD_NAMESPACE" \
                deployment/argocd-applicationset-controller \
                --tail=100 || true

              exit 1
            fi

            kubectl get application "$APP" \
              -n "$ARGOCD_NAMESPACE"
          done

      # --------------------------------------------------
      # REQUEST PAYMENT APPLICATION SYNC
      # --------------------------------------------------

      - name: Request Payment Service sync
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            echo "Requesting sync: $APP"

            kubectl patch application "$APP" \
              -n "$ARGOCD_NAMESPACE" \
              --type merge \
              -p '{"operation":{"sync":{}}}'
          done

      # --------------------------------------------------
      # WAIT FOR PAYMENT APPLICATION HEALTH
      # --------------------------------------------------

      - name: Wait for Payment Service health
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            READY=false

            for i in $(seq 1 36); do
              SYNC_STATUS="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"

              HEALTH_STATUS="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.health.status}' 2>/dev/null || true)"

              echo "$APP: sync=$SYNC_STATUS health=$HEALTH_STATUS"

              if [[ "$SYNC_STATUS" == "Synced" && \
                    "$HEALTH_STATUS" == "Healthy" ]]; then
                READY=true
                break
              fi

              sleep 10
            done

            if [[ "$READY" != "true" ]]; then
              echo "::error::$APP did not become Synced and Healthy."

              kubectl describe application "$APP" \
                -n "$ARGOCD_NAMESPACE" || true

              NS="payment-${APP##*-}"

              kubectl get rollouts,pods,services \
                -n "$NS" -o wide || true

              kubectl describe rollouts \
                -n "$NS" || true

              exit 1
            fi
          done

      # --------------------------------------------------
      # DEPLOY RELEASE DASHBOARD
      # --------------------------------------------------

      - name: Deploy Release Dashboard
        shell: bash
        run: |
          set -euo pipefail

          DIR="devops-infra/kubernetes/release-dashboard"

          test -f "$DIR/release-dashboard-rbac.yaml"
          test -f "$DIR/release-dashboard-deployment.yaml"
          test -f "$DIR/release-dashboard-service.yaml"

          echo "Applying Release Dashboard RBAC..."

          kubectl apply \
            -n "$DASHBOARD_NAMESPACE" \
            -f "$DIR/release-dashboard-rbac.yaml"

          echo "Applying Release Dashboard Deployment..."

          kubectl apply \
            -n "$DASHBOARD_NAMESPACE" \
            -f "$DIR/release-dashboard-deployment.yaml"

          echo "Applying Release Dashboard Service..."

          kubectl apply \
            -n "$DASHBOARD_NAMESPACE" \
            -f "$DIR/release-dashboard-service.yaml"

      # --------------------------------------------------
      # VERIFY RELEASE DASHBOARD
      # --------------------------------------------------

      - name: Verify Release Dashboard
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/release-dashboard \
            -n "$DASHBOARD_NAMESPACE" \
            --timeout=300s

          kubectl get deployments,pods,services \
            -n "$DASHBOARD_NAMESPACE" -o wide

      # --------------------------------------------------
      # VERIFY PAYMENT WORKLOADS
      # --------------------------------------------------

      - name: Verify Payment Service workloads
        shell: bash
        run: |
          set -euo pipefail

          for NS in payment-dev payment-stage payment-prod; do
            echo "========================================"
            echo "PAYMENT SERVICE: $NS"
            echo "========================================"

            kubectl get rollouts -n "$NS" -o wide
            kubectl get pods -n "$NS" -o wide
            kubectl get services -n "$NS" -o wide
          done

      # --------------------------------------------------
      # FINAL REPORT
      # --------------------------------------------------

      - name: Final deployment report
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ARGO CD APPLICATIONS"
          echo "========================================"

          kubectl get applications.argoproj.io \
            -n "$ARGOCD_NAMESPACE" -o wide || true

          echo "========================================"
          echo "ARGO ROLLOUTS CONTROLLER"
          echo "========================================"

          kubectl get deployments,pods \
            -n "$ROLLOUTS_NAMESPACE" -o wide || true

          kubectl logs \
            -n "$ROLLOUTS_NAMESPACE" \
            deployment/argo-rollouts \
            --tail=100 || true

          echo "========================================"
          echo "RELEASE DASHBOARD"
          echo "========================================"

          kubectl get deployments,pods,services \
            -n "$DASHBOARD_NAMESPACE" -o wide || true

          echo "========================================"
          echo "PAYMENT WORKLOADS"
          echo "========================================"

          for NS in payment-dev payment-stage payment-prod; do
            echo "========================================"
            echo "PAYMENT WORKLOADS: $NS"
            echo "========================================"

            kubectl get rollouts,pods,services \
              -n "$NS" -o wide || true
          done
