name: 01 - Preflight, Deploy and Verify

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/01-Preflight.yml"
      - "devops-infra/argocd/**"
      - "devops-infra/kubernetes/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: preflight-deploy-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster
  ARGOCD_NAMESPACE: argocd
  DASHBOARD_NAMESPACE: release-dashboard
  IMAGE_TAG: v1.2.0
  GAR_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:
  deploy:
    name: Bootstrap Argo CD, Deploy and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # GOOGLE CLOUD AUTHENTICATION
      # --------------------------------------------------

      - name: Validate required configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          [[ -n "${GCP_PROJECT_ID:-}" ]] || {
            echo "::error::GCP_PROJECT_ID secret is missing."
            exit 1
          }

          [[ -n "${WIF_PROVIDER:-}" ]] || {
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER secret is missing."
            exit 1
          }

          [[ -n "${GCP_SERVICE_ACCOUNT:-}" ]] || {
            echo "::error::GCP_SERVICE_ACCOUNT secret is missing."
            exit 1
          }

          echo "Required GitHub configuration is present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list
          gcloud config get-value project

      # --------------------------------------------------
      # CONNECT TO GKE
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify GKE connectivity
        shell: bash
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      # --------------------------------------------------
      # INSTALL ARGO CD
      # --------------------------------------------------

      - name: Install or upgrade Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$ARGOCD_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -n "$ARGOCD_NAMESPACE" \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.9/manifests/install.yaml

          kubectl rollout status deployment/argocd-server \
            -n "$ARGOCD_NAMESPACE" --timeout=300s

          kubectl rollout status deployment/argocd-repo-server \
            -n "$ARGOCD_NAMESPACE" --timeout=300s

          kubectl rollout status deployment/argocd-applicationset-controller \
            -n "$ARGOCD_NAMESPACE" --timeout=300s

      # --------------------------------------------------
      # INSTALL ARGO ROLLOUTS
      # --------------------------------------------------

      - name: Install Argo Rollouts controller
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml

          kubectl rollout status deployment/argo-rollouts \
            -n argo-rollouts --timeout=300s

      # --------------------------------------------------
      # CREATE NAMESPACES
      # --------------------------------------------------

      - name: Create application namespaces
        shell: bash
        run: |
          set -euo pipefail

          for NS in \
            payment-dev \
            payment-stage \
            payment-prod \
            release-dashboard
          do
            kubectl create namespace "$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      # --------------------------------------------------
      # APPLY ARGO CD ROOT APPLICATION
      # --------------------------------------------------

      - name: Apply Argo CD root application
        shell: bash
        run: |
          set -euo pipefail

          test -f devops-infra/argocd/application.yaml

          kubectl apply -f devops-infra/argocd/application.yaml

      - name: Wait for Payment Service ApplicationSet
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f \
            devops-infra/kubernetes/argocd/payment-service-applicationset.yaml

          for i in $(seq 1 30); do
            if kubectl get application payment-service-dev \
              -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
              break
            fi

            echo "Waiting for ApplicationSet to create applications ($i/30)"
            sleep 10
          done

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            kubectl get application "$APP" \
              -n "$ARGOCD_NAMESPACE"
          done

      # --------------------------------------------------
      # SYNC PAYMENT SERVICE APPLICATIONS
      # --------------------------------------------------

      - name: Sync Payment Service applications
        shell: bash
        run: |
          set -euo pipefail

          for APP in \
            payment-service-dev \
            payment-service-stage \
            payment-service-prod
          do
            echo "Syncing $APP"

            kubectl patch application "$APP" \
              -n "$ARGOCD_NAMESPACE" \
              --type merge \
              -p '{"operation":{"sync":{}}}'

            for i in $(seq 1 30); do
              STATUS="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"

              HEALTH="$(kubectl get application "$APP" \
                -n "$ARGOCD_NAMESPACE" \
                -o jsonpath='{.status.health.status}' 2>/dev/null || true)"

              echo "$APP: sync=$STATUS health=$HEALTH"

              if [[ "$STATUS" == "Synced" && "$HEALTH" == "Healthy" ]]; then
                break
              fi

              sleep 10
            done
          done

      # --------------------------------------------------
      # RELEASE DASHBOARD RBAC AND DEPLOYMENT
      # --------------------------------------------------

      - name: Apply Release Dashboard resources
        shell: bash
        run: |
          set -euo pipefail

          test -f devops-infra/kubernetes/release-dashboard/release-dashboard-rbac.yaml
          test -f devops-infra/kubernetes/release-dashboard/release-dashboard-deployment.yaml
          test -f devops-infra/kubernetes/release-dashboard/release-dashboard-service.yaml

          kubectl apply -f \
            devops-infra/kubernetes/release-dashboard/release-dashboard-rbac.yaml \
            -n "$DASHBOARD_NAMESPACE"

          kubectl apply -f \
            devops-infra/kubernetes/release-dashboard/release-dashboard-deployment.yaml \
            -n "$DASHBOARD_NAMESPACE"

          kubectl apply -f \
            devops-infra/kubernetes/release-dashboard/release-dashboard-service.yaml \
            -n "$DASHBOARD_NAMESPACE"

      # --------------------------------------------------
      # VERIFY DEPLOYMENTS
      # --------------------------------------------------

      - name: Verify Release Dashboard
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/release-dashboard \
            -n "$DASHBOARD_NAMESPACE" --timeout=300s

          kubectl get deployment,pods,services \
            -n "$DASHBOARD_NAMESPACE" -o wide

      - name: Verify Payment Service workloads
        shell: bash
        run: |
          set -euo pipefail

          for NS in payment-dev payment-stage payment-prod; do
            echo "========================================"
            echo "Namespace: $NS"
            echo "========================================"

            kubectl get rollouts -n "$NS" -o wide
            kubectl get pods -n "$NS" -o wide
            kubectl get services -n "$NS" -o wide
          done

      - name: Argo CD status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ARGO CD APPLICATIONS"
          echo "========================================"

          kubectl get applications.argoproj.io \
            -n "$ARGOCD_NAMESPACE" -o wide || true

          echo "========================================"
          echo "ARGO ROLLOUTS"
          echo "========================================"

          kubectl get pods -n argo-rollouts -o wide || true

          echo "========================================"
          echo "RELEASE DASHBOARD"
          echo "========================================"

          kubectl get deployments,pods,services \
            -n "$DASHBOARD_NAMESPACE" -o wide || true

          echo "========================================"
          echo "PAYMENT SERVICE"
          echo "========================================"

          for NS in payment-dev payment-stage payment-prod; do
            kubectl get rollouts,pods,services \
              -n "$NS" -o wide || true
          done
