name: 07 - Promote Production Pilot to Fleet

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image tag validated in Production Pilot
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-blue-green.yaml
    with:
      namespace: payment-prod-fleet
      replicas: 2
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
