name: 02 - Build and Push DEV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Payment Service release tag, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo
  GHCR_OWNER: reytaker101-byte

jobs:
  build-and-push:
    name: Build and Push Payment Service
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag. Expected v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Payment Service image
        shell: bash
        run: |
          set -euo pipefail

          GAR_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${IMAGE_TAG}"
          GAR_SHA_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${GITHUB_SHA}"

          GHCR_IMAGE="ghcr.io/${GHCR_OWNER}/payment-service:${IMAGE_TAG}"
          GHCR_SHA_IMAGE="ghcr.io/${GHCR_OWNER}/payment-service:${GITHUB_SHA}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "$GAR_IMAGE" \
            -t "$GAR_SHA_IMAGE" \
            -t "$GHCR_IMAGE" \
            -t "$GHCR_SHA_IMAGE" \
            ./services/payment-service

          echo "GAR_IMAGE=$GAR_IMAGE" >> "$GITHUB_ENV"
          echo "GAR_SHA_IMAGE=$GAR_SHA_IMAGE" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          echo "GHCR_SHA_IMAGE=$GHCR_SHA_IMAGE" >> "$GITHUB_ENV"

      - name: Push Payment Service to GCP Artifact Registry
        run: |
          set -euo pipefail

          docker push "$GAR_IMAGE"
          docker push "$GAR_SHA_IMAGE"

      - name: Push Payment Service to GHCR
        run: |
          set -euo pipefail

          docker push "$GHCR_IMAGE"
          docker push "$GHCR_SHA_IMAGE"

      - name: Verify GCP image
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          DIGEST=$(gcloud artifacts docker images describe \
            "$GAR_IMAGE" \
            --format='value(image_summary.digest)')

          if [[ -z "$DIGEST" ]]; then
            echo "Image digest not found in GCP Artifact Registry"
            exit 1
          fi

          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Payment Service Build"
            echo ""
            echo "- Image tag: ${IMAGE_TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- GCP image: ${GAR_IMAGE}"
            echo "- GCP digest: ${{ steps.verify.outputs.image_digest }}"
            echo "- GHCR image: ${GHCR_IMAGE}"
            echo ""
            echo "Only Payment Service was built by this workflow."
            echo "Release Dashboard was not rebuilt or versioned."
          } >> "$GITHUB_STEP_SUMMARY"
