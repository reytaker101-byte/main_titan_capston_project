name: 02 - Build and Push DEV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Payment Service release tag, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo
  GHCR_OWNER: reytaker101-byte
  DASHBOARD_IMAGE_NAME: release-dashboard

jobs:
  build-and-push:
    name: Build and Push Application Images
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag. Expected v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Build Payment Service
      # ------------------------------------------
      - name: Build Payment Service image
        shell: bash
        run: |
          set -euo pipefail

          GAR_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${IMAGE_TAG}"
          GAR_SHA_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${GITHUB_SHA}"

          GHCR_IMAGE="ghcr.io/${GHCR_OWNER}/payment-service:${IMAGE_TAG}"
          GHCR_SHA_IMAGE="ghcr.io/${GHCR_OWNER}/payment-service:${GITHUB_SHA}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "$GAR_IMAGE" \
            -t "$GAR_SHA_IMAGE" \
            -t "$GHCR_IMAGE" \
            -t "$GHCR_SHA_IMAGE" \
            ./services/payment-service

          echo "GAR_IMAGE=$GAR_IMAGE" >> "$GITHUB_ENV"
          echo "GAR_SHA_IMAGE=$GAR_SHA_IMAGE" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          echo "GHCR_SHA_IMAGE=$GHCR_SHA_IMAGE" >> "$GITHUB_ENV"

      - name: Push Payment Service to GCP Artifact Registry
        shell: bash
        run: |
          set -euo pipefail

          docker push "$GAR_IMAGE"
          docker push "$GAR_SHA_IMAGE"

      - name: Push Payment Service to GHCR
        shell: bash
        run: |
          set -euo pipefail

          docker push "$GHCR_IMAGE"
          docker push "$GHCR_SHA_IMAGE"

      # ------------------------------------------
      # Build Release Dashboard
      # ------------------------------------------
      - name: Build Release Dashboard image
        shell: bash
        run: |
          set -euo pipefail

          DASHBOARD_GAR_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${DASHBOARD_IMAGE_NAME}:${IMAGE_TAG}"
          DASHBOARD_GAR_SHA_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${DASHBOARD_IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "$DASHBOARD_GAR_IMAGE" \
            -t "$DASHBOARD_GAR_SHA_IMAGE" \
            ./devops-infra/release-dashboard

          echo "DASHBOARD_GAR_IMAGE=$DASHBOARD_GAR_IMAGE" >> "$GITHUB_ENV"
          echo "DASHBOARD_GAR_SHA_IMAGE=$DASHBOARD_GAR_SHA_IMAGE" >> "$GITHUB_ENV"

      - name: Push Release Dashboard to GCP Artifact Registry
        shell: bash
        run: |
          set -euo pipefail

          docker push "$DASHBOARD_GAR_IMAGE"
          docker push "$DASHBOARD_GAR_SHA_IMAGE"

      # ------------------------------------------
      # Verify images
      # ------------------------------------------
      - name: Verify Payment Service image
        id: verify-payment
        shell: bash
        run: |
          set -euo pipefail

          DIGEST=$(gcloud artifacts docker images describe \
            "$GAR_IMAGE" \
            --format='value(image_summary.digest)')

          if [[ -z "$DIGEST" ]]; then
            echo "Payment Service image digest not found"
            exit 1
          fi

          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify Release Dashboard image
        id: verify-dashboard
        shell: bash
        run: |
          set -euo pipefail

          DIGEST=$(gcloud artifacts docker images describe \
            "$DASHBOARD_GAR_IMAGE" \
            --format='value(image_summary.digest)')

          if [[ -z "$DIGEST" ]]; then
            echo "Release Dashboard image digest not found"
            exit 1
          fi

          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # Build summary
      # ------------------------------------------
      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Application Image Build Summary"
            echo ""
            echo "### Payment Service"
            echo "- Tag: ${IMAGE_TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- GAR image: ${GAR_IMAGE}"
            echo "- GAR digest: ${{ steps.verify-payment.outputs.image_digest }}"
            echo "- GHCR image: ${GHCR_IMAGE}"
            echo ""
            echo "### Release Dashboard"
            echo "- Tag: ${IMAGE_TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- GAR image: ${DASHBOARD_GAR_IMAGE}"
            echo "- GAR digest: ${{ steps.verify-dashboard.outputs.image_digest }}"
            echo ""
            echo "Both application images were built and pushed."
          } >> "$GITHUB_STEP_SUMMARY"
