name: Promote Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

      image_tag:
        description: "Existing image version to promote, e.g. v1.0.0"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Authenticate to GCP using Workload Identity
      # --------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # --------------------------------------------------
      # 3. Configure Docker for Artifact Registry
      # --------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_REGION }}-docker.pkg.dev \
            --quiet

      # --------------------------------------------------
      # 4. Validate image tag format
      # --------------------------------------------------
      - name: Validate image tag
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"

          echo "Validating image tag: $IMAGE_TAG"

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag."
            echo "Expected format: v1.0.0"
            exit 1
          fi

          echo "Image tag format is valid."

      # --------------------------------------------------
      # 5. Verify source images exist
      # --------------------------------------------------
      - name: Verify source images
        run: |
          echo "=========================================="
          echo "Checking source images"
          echo "Version: ${{ inputs.image_tag }}"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SERVICE:${{ inputs.image_tag }}"

            echo ""
            echo "Checking:"
            echo "$IMAGE"

            if ! gcloud artifacts docker images describe "$IMAGE"; then
              echo ""
              echo "ERROR: Source image does not exist:"
              echo "$IMAGE"
              exit 1
            fi

          done

          echo ""
          echo "All four source images exist."

      # --------------------------------------------------
      # 6. Promote images
      # --------------------------------------------------
      - name: Promote images
        run: |
          echo "=========================================="
          echo "Starting Image Promotion"
          echo "=========================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Version     : ${{ inputs.image_tag }}"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            SOURCE_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SERVICE:${{ inputs.image_tag }}"

            TARGET_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SERVICE:${{ inputs.environment }}-${{ inputs.image_tag }}"

            echo ""
            echo "Service : $SERVICE"
            echo "Source  : $SOURCE_IMAGE"
            echo "Target  : $TARGET_IMAGE"

            gcloud artifacts docker tags add \
              "$SOURCE_IMAGE" \
              "$TARGET_IMAGE"

          done

          echo ""
          echo "=========================================="
          echo "Image promotion completed."
          echo "=========================================="

      # --------------------------------------------------
      # 7. Verify promoted images
      # --------------------------------------------------
      - name: Verify promoted images
        run: |
          echo "=========================================="
          echo "Verifying promoted images"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            PROMOTED_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SERVICE:${{ inputs.environment }}-${{ inputs.image_tag }}"

            echo ""
            echo "Verifying:"
            echo "$PROMOTED_IMAGE"

            gcloud artifacts docker images describe \
              "$PROMOTED_IMAGE"

          done

          echo ""
          echo "=========================================="
          echo "PROMOTION VERIFIED SUCCESSFULLY"
          echo "=========================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Version     : ${{ inputs.image_tag }}"
          echo "=========================================="
