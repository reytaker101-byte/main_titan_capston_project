name: Promote Image

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - prod

      image_tag:
        description: "Existing image version to promote"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:

  # ==========================================================
  # IMAGE PROMOTION
  # ==========================================================
  promote:
    name: Promote Image
    runs-on: ubuntu-latest

    env:
      TARGET_ENV: ${{ inputs.target_environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Validate image tag
      # ------------------------------------------------------
      - name: Validate image tag
        run: |
          echo "Validating image tag: $IMAGE_TAG"

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag."
            echo "Expected format: v<major>.<minor>.<patch>"
            exit 1
          fi

          echo "Image tag format is valid."


      # ------------------------------------------------------
      # 3. Determine source environment
      # ------------------------------------------------------
      - name: Determine source environment
        run: |

          if [[ "$TARGET_ENV" == "stage" ]]; then
            SOURCE_ENV="dev"

          elif [[ "$TARGET_ENV" == "prod" ]]; then
            SOURCE_ENV="stage"

          else
            echo "ERROR: Invalid target environment."
            exit 1
          fi

          echo "SOURCE_ENV=$SOURCE_ENV" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROMOTION PATH"
          echo "=========================================="
          echo "Source      : $SOURCE_ENV"
          echo "Target      : $TARGET_ENV"
          echo "Version     : $IMAGE_TAG"
          echo "=========================================="


      # ------------------------------------------------------
      # 4. Authenticate to GCP using Workload Identity
      # ------------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ------------------------------------------------------
      # 5. Configure Docker for Artifact Registry
      # ------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_REGION }}-docker.pkg.dev \
            --quiet


      # ======================================================
      # VERIFY SOURCE
      # ======================================================

      # ------------------------------------------------------
      # 6. Verify source images
      # ------------------------------------------------------
      - name: Verify source images
        run: |

          echo "=========================================="
          echo "CHECKING SOURCE IMAGES"
          echo "=========================================="

          echo "Source environment: $SOURCE_ENV"
          echo "Image version     : $IMAGE_TAG"

          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            SOURCE_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SOURCE_ENV/$SERVICE:$IMAGE_TAG"

            echo ""
            echo "Checking:"
            echo "$SOURCE_IMAGE"

            if ! gcloud artifacts docker images describe "$SOURCE_IMAGE"; then

              echo ""
              echo "ERROR: Source image does not exist:"
              echo "$SOURCE_IMAGE"

              exit 1
            fi

          done

          echo ""
          echo "All source images exist."


      # ------------------------------------------------------
      # 7. Capture source image digests
      # ------------------------------------------------------
      - name: Capture source image digests
        run: |

          echo "=========================================="
          echo "SOURCE IMAGE DIGESTS"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            SOURCE_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SOURCE_ENV/$SERVICE:$IMAGE_TAG"

            DIGEST=$(gcloud artifacts docker images describe \
              "$SOURCE_IMAGE" \
              --format='value(image_summary.digest)')

            echo ""
            echo "$SERVICE"
            echo "Digest: $DIGEST"

          done


      # ======================================================
      # PROMOTION
      # ======================================================

      # ------------------------------------------------------
      # 8. Promote images
      # ------------------------------------------------------
      - name: Promote images
        run: |

          echo "=========================================="
          echo "STARTING IMAGE PROMOTION"
          echo "=========================================="

          echo "Source      : $SOURCE_ENV"
          echo "Target      : $TARGET_ENV"
          echo "Version     : $IMAGE_TAG"

          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            SOURCE_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SOURCE_ENV/$SERVICE:$IMAGE_TAG"

            TARGET_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$TARGET_ENV/$SERVICE:$IMAGE_TAG"

            echo ""
            echo "=========================================="
            echo "Service : $SERVICE"
            echo "Source  : $SOURCE_IMAGE"
            echo "Target  : $TARGET_IMAGE"
            echo "=========================================="

            echo ""
            echo "Pulling source image..."

            docker pull "$SOURCE_IMAGE"

            echo ""
            echo "Tagging image for target environment..."

            docker tag \
              "$SOURCE_IMAGE" \
              "$TARGET_IMAGE"

            echo ""
            echo "Pushing image to target environment..."

            docker push "$TARGET_IMAGE"

          done

          echo ""
          echo "=========================================="
          echo "IMAGE PROMOTION COMPLETED"
          echo "=========================================="


      # ======================================================
      # VERIFY TARGET
      # ======================================================

      # ------------------------------------------------------
      # 9. Verify target images
      # ------------------------------------------------------
      - name: Verify target images
        run: |

          echo "=========================================="
          echo "VERIFYING TARGET IMAGES"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            TARGET_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$TARGET_ENV/$SERVICE:$IMAGE_TAG"

            echo ""
            echo "Verifying:"
            echo "$TARGET_IMAGE"

            if ! gcloud artifacts docker images describe "$TARGET_IMAGE"; then

              echo ""
              echo "ERROR: Target image verification failed:"
              echo "$TARGET_IMAGE"

              exit 1
            fi

          done

          echo ""
          echo "All target images exist."


      # ======================================================
      # VERIFY DIGEST
      # ======================================================

      # ------------------------------------------------------
      # 10. Verify source and target have the same digest
      # ------------------------------------------------------
      - name: Verify image digests
        run: |

          echo "=========================================="
          echo "VERIFYING IMAGE DIGESTS"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do

            SOURCE_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$SOURCE_ENV/$SERVICE:$IMAGE_TAG"

            TARGET_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/$TARGET_ENV/$SERVICE:$IMAGE_TAG"

            SOURCE_DIGEST=$(gcloud artifacts docker images describe \
              "$SOURCE_IMAGE" \
              --format='value(image_summary.digest)')

            TARGET_DIGEST=$(gcloud artifacts docker images describe \
              "$TARGET_IMAGE" \
              --format='value(image_summary.digest)')

            echo ""
            echo "Service       : $SERVICE"
            echo "Source        : $SOURCE_ENV"
            echo "Target        : $TARGET_ENV"
            echo "Source digest : $SOURCE_DIGEST"
            echo "Target digest : $TARGET_DIGEST"

            if [ "$SOURCE_DIGEST" != "$TARGET_DIGEST" ]; then

              echo ""
              echo "ERROR: Digest mismatch!"
              echo "The promoted image does not match the source image."

              exit 1
            fi

            echo "Digest verification: PASSED"

          done

          echo ""
          echo "=========================================="
          echo "PROMOTION VERIFIED SUCCESSFULLY"
          echo "=========================================="

          echo "Source      : $SOURCE_ENV"
          echo "Target      : $TARGET_ENV"
          echo "Version     : $IMAGE_TAG"
          echo "Same digest : YES"

          echo "=========================================="
