name: 1.Build and Push Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image version to build, e.g. v1.0.0"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:

  # ==========================================================
  # CODEQL SECURITY SCAN
  # ==========================================================
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================================
  # BUILD AND PUSH TO DEV
  # ==========================================================
  build-and-push:
    name: Build and Push Images to DEV
    needs: codeql
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Validate image version
      # ------------------------------------------------------
      - name: Validate image tag
        run: |
          echo "Validating image tag: $IMAGE_TAG"

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag."
            echo "Expected format: v1.0.0"
            exit 1
          fi

          echo "Image tag is valid."

      # ------------------------------------------------------
      # Authenticate to GCP
      # ------------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ------------------------------------------------------
      # Configure Docker for Artifact Registry
      # ------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_REGION }}-docker.pkg.dev \
            --quiet

      # ------------------------------------------------------
      # Build catalog-service
      # ------------------------------------------------------
      - name: Build catalog-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/catalog-service:${IMAGE_TAG} \
            ./services/catalog-service

      # ------------------------------------------------------
      # Build cart-service
      # ------------------------------------------------------
      - name: Build cart-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/cart-service:${IMAGE_TAG} \
            ./services/cart-service

      # ------------------------------------------------------
      # Build order-service
      # ------------------------------------------------------
      - name: Build order-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/order-service:${IMAGE_TAG} \
            ./services/order-service

      # ------------------------------------------------------
      # Build payment-service
      # ------------------------------------------------------
      - name: Build payment-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/payment-service:${IMAGE_TAG} \
            ./services/payment-service

      # ------------------------------------------------------
      # Push catalog-service
      # ------------------------------------------------------
      - name: Push catalog-service to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/catalog-service:${IMAGE_TAG}

      # ------------------------------------------------------
      # Push cart-service
      # ------------------------------------------------------
      - name: Push cart-service to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/cart-service:${IMAGE_TAG}

      # ------------------------------------------------------
      # Push order-service
      # ------------------------------------------------------
      - name: Push order-service to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/order-service:${IMAGE_TAG}

      # ------------------------------------------------------
      # Push payment-service
      # ------------------------------------------------------
      - name: Push payment-service to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/payment-service:${IMAGE_TAG}

      # ------------------------------------------------------
      # Verify DEV images
      # ------------------------------------------------------
      - name: Verify DEV images
        run: |
          echo "=========================================="
          echo "DEV IMAGES"
          echo "Version: $IMAGE_TAG"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do
            IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/$SERVICE:${IMAGE_TAG}"

            echo ""
            echo "Verifying:"
            echo "$IMAGE"

            gcloud artifacts docker images describe "$IMAGE"
          done

          echo ""
          echo "=========================================="
          echo "DEV IMAGE BUILD AND PUSH SUCCESSFUL"
          echo "=========================================="
