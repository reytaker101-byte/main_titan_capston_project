name: 1.Build and Push Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image version to build"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:

  # ==========================================================
  # CODEQL SECURITY SCAN
  # ==========================================================
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================================
  # BUILD AND PUSH TO DEV
  # ==========================================================
  build-and-push:
    name: Build and Push Images to DEV
    needs: codeql
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          echo "Validating image tag: $IMAGE_TAG"

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag."
            echo "Expected format: v<major>.<minor>.<patch>"
            exit 1
          fi

          echo "Image tag is valid."

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_REGION }}-docker.pkg.dev \
            --quiet


      # ======================================================
      # BUILD IMAGES
      # ======================================================

      - name: Build payment-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/payment-service:${IMAGE_TAG} \
            ./services/payment-service

      - name: Build release-dashboard
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/release-dashboard:${IMAGE_TAG} \
            ./release-dashboard


      # ======================================================
      # PUSH IMAGES TO DEV
      # ======================================================

      - name: Push payment-service to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/payment-service:${IMAGE_TAG}

      - name: Push release-dashboard to DEV
        run: |
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/release-dashboard:${IMAGE_TAG}


      # ======================================================
      # VERIFY DEV IMAGES
      # ======================================================

      - name: Verify DEV images
        run: |

          echo "=========================================="
          echo "DEV IMAGES"
          echo "=========================================="

          echo "Version: $IMAGE_TAG"

          echo "=========================================="

          for SERVICE in \
            payment-service \
            release-dashboard
          do

            IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dev/$SERVICE:${IMAGE_TAG}"

            echo ""
            echo "Verifying:"
            echo "$IMAGE"

            gcloud artifacts docker images describe "$IMAGE"

          done

          echo ""
          echo "=========================================="
          echo "DEV IMAGE BUILD AND PUSH SUCCESSFUL"
          echo "=========================================="


  # ==========================================================
  # BOOTSTRAP / ENSURE ARGO CD
  # ==========================================================
  bootstrap-argocd:
    name: Ensure Argo CD
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Authenticate to GCP
      # ------------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ------------------------------------------------------
      # Get GKE credentials
      # ------------------------------------------------------
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}


      # ------------------------------------------------------
      # Verify GKE connection
      # ------------------------------------------------------
      - name: Verify GKE connection
        run: |
          echo "=========================================="
          echo "GKE CLUSTER"
          echo "=========================================="

          kubectl cluster-info

          echo ""
          echo "=========================================="
          echo "CURRENT NAMESPACES"
          echo "=========================================="

          kubectl get namespaces


      # ------------------------------------------------------
      # Create Argo CD namespace
      # ------------------------------------------------------
      - name: Ensure Argo CD namespace
        run: |
          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ------------------------------------------------------
      # Install / reconcile Argo CD
      # ------------------------------------------------------
      - name: Install or reconcile Argo CD
        run: |
          kubectl apply \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.9/manifests/install.yaml


      # ------------------------------------------------------
      # Wait for Argo CD server
      # ------------------------------------------------------
      - name: Wait for Argo CD
        run: |
          kubectl wait \
            --namespace argocd \
            --for=condition=Available \
            deployment/argocd-server \
            --timeout=300s


      # ------------------------------------------------------
      # Register GitOps Application
      # ------------------------------------------------------
      - name: Apply Argo CD Application
        run: |
          kubectl apply \
            -f devops-infra/argocd/application.yaml


      # ------------------------------------------------------
      # Expose Argo CD UI
      # ------------------------------------------------------
      - name: Expose Argo CD server
        run: |
          kubectl apply \
            -f devops-infra/argocd/argocd-server-service.yaml


      # ======================================================
      # VERIFY ARGO CD
      # ======================================================

      - name: Verify Argo CD namespaces
        run: |

          echo ""
          echo "=========================================="
          echo "ARGO CD NAMESPACE"
          echo "=========================================="

          kubectl get namespace argocd


      - name: Verify Argo CD pods
        run: |

          echo ""
          echo "=========================================="
          echo "ARGO CD PODS"
          echo "=========================================="

          kubectl get pods \
            -n argocd \
            -o wide


      - name: Verify Argo CD services
        run: |

          echo ""
          echo "=========================================="
          echo "ARGO CD SERVICES"
          echo "=========================================="

          kubectl get svc \
            -n argocd


      # ======================================================
      # DISPLAY ARGO CD EXTERNAL IP
      # ======================================================

      - name: Display Argo CD UI address
        run: |

          echo ""
          echo "=========================================="
          echo "ARGO CD UI"
          echo "=========================================="

          EXTERNAL_IP=""

          for i in {1..30}; do

            EXTERNAL_IP=$(kubectl get svc argocd-server \
              -n argocd \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi

            echo "Waiting for Argo CD LoadBalancer IP..."
            sleep 10

          done

          if [ -n "$EXTERNAL_IP" ]; then

            echo ""
            echo "Argo CD External IP:"
            echo "$EXTERNAL_IP"

            echo ""
            echo "Argo CD UI:"
            echo "https://$EXTERNAL_IP"

          else

            echo ""
            echo "Argo CD LoadBalancer IP is not available yet."
            echo "Current service:"
            kubectl get svc argocd-server -n argocd

          fi


      # ======================================================
      # FINAL CLUSTER STATUS
      # ======================================================

      - name: Display cluster status
        run: |

          echo ""
          echo "=========================================="
          echo "CLUSTER NAMESPACES"
          echo "=========================================="

          kubectl get namespaces

          echo ""
          echo "=========================================="
          echo "ALL PODS"
          echo "=========================================="

          kubectl get pods -A

          echo ""
          echo "=========================================="
          echo "ALL SERVICES"
          echo "=========================================="

          kubectl get svc -A

          echo ""
          echo "=========================================="
          echo "ARGO CD BOOTSTRAP COMPLETED"
          echo "=========================================="
