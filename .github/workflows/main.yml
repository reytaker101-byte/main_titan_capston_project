name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image version to build, e.g. v1.0.0"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:

  # ==========================================================
  # CODEQL SECURITY SCAN
  # ==========================================================
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================================
  build-and-push:
    name: Build and Push Images
    needs: codeql
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          echo "Validating image tag: $IMAGE_TAG"

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag."
            echo "Expected format: v1.0.0"
            exit 1
          fi

          echo "Image tag is valid: $IMAGE_TAG"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            $GCP_REGION-docker.pkg.dev \
            --quiet

      - name: Build catalog-service
        run: |
          docker build \
            -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/catalog-service:$IMAGE_TAG \
            ./services/catalog-service

      - name: Build cart-service
        run: |
          docker build \
            -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/cart-service:$IMAGE_TAG \
            ./services/cart-service

      - name: Build order-service
        run: |
          docker build \
            -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/order-service:$IMAGE_TAG \
            ./services/order-service

      - name: Build payment-service
        run: |
          docker build \
            -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/payment-service:$IMAGE_TAG \
            ./services/payment-service

      - name: Push catalog-service
        run: |
          docker push \
            $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/catalog-service:$IMAGE_TAG

      - name: Push cart-service
        run: |
          docker push \
            $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/cart-service:$IMAGE_TAG

      - name: Push order-service
        run: |
          docker push \
            $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/order-service:$IMAGE_TAG

      - name: Push payment-service
        run: |
          docker push \
            $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/payment-service:$IMAGE_TAG

      - name: Verify images
        run: |
          echo "=========================================="
          echo "Verifying images"
          echo "Version: $IMAGE_TAG"
          echo "=========================================="

          for SERVICE in \
            catalog-service \
            cart-service \
            order-service \
            payment-service
          do
            IMAGE="$GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPOSITORY/$SERVICE:$IMAGE_TAG"

            echo ""
            echo "Checking: $IMAGE"

            gcloud artifacts docker images describe "$IMAGE"
          done

          echo ""
          echo "=========================================="
          echo "BUILD AND PUSH SUCCESSFUL"
          echo "Version: $IMAGE_TAG"
          echo "=========================================="
