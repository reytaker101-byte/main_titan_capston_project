name: 05 - Blue Green Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - pilot
          - fleet

      image_tag:
        description: "Image tag"
        required: true
        type: string

      target_color:
        description: "Color to deploy/activate"
        required: true
        type: choice
        options:
          - blue
          - green

      switch_traffic:
        description: "Switch traffic to target color?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster

jobs:

  blue-green:
    name: Blue Green Deployment
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment == 'fleet' && 'production' || '' }}

    env:
      TARGET_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_COLOR: ${{ inputs.target_color }}
      SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "BLUE-GREEN DEPLOYMENT INPUTS"
          echo "=================================================="

          echo "Environment    : ${TARGET_ENV}"
          echo "Image Tag      : ${IMAGE_TAG}"
          echo "Target Color   : ${TARGET_COLOR}"
          echo "Switch Traffic : ${SWITCH_TRAFFIC}"

          echo ""

          # Validate semantic version
          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag: ${IMAGE_TAG}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          # Validate environment
          if [[ "${TARGET_ENV}" != "stage" &&
                "${TARGET_ENV}" != "pilot" &&
                "${TARGET_ENV}" != "fleet" ]]; then

            echo "ERROR: Invalid environment: ${TARGET_ENV}"
            exit 1
          fi

          # Validate color
          if [[ "${TARGET_COLOR}" != "blue" &&
                "${TARGET_COLOR}" != "green" ]]; then

            echo "ERROR: Invalid target color: ${TARGET_COLOR}"
            exit 1
          fi

          # Validate traffic switch
          if [[ "${SWITCH_TRAFFIC}" != "yes" &&
                "${SWITCH_TRAFFIC}" != "no" ]]; then

            echo "ERROR: switch_traffic must be yes or no"
            exit 1
          fi

          echo ""
          echo "Input validation passed."


      # ============================================================
      # 3. RESOLVE GITOPS FILES
      # ============================================================

      - name: Resolve GitOps files
        shell: bash
        run: |
          set -euo pipefail

          case "${TARGET_ENV}" in

            stage)

              NAMESPACE="ai-sre-stage"

              SERVICE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-service.yaml"

              BLUE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-blue.yaml"

              GREEN_FILE="devops-infra/kubernetes/manifests/stage-payment-service-green.yaml"

              ;;

            pilot)

              NAMESPACE="ai-sre-pilot"

              SERVICE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-service.yaml"

              BLUE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-blue.yaml"

              GREEN_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-green.yaml"

              ;;

            fleet)

              NAMESPACE="ai-sre-fleet"

              SERVICE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-service.yaml"

              BLUE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-blue.yaml"

              GREEN_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-green.yaml"

              ;;

          esac

          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"
          echo "SERVICE_FILE=${SERVICE_FILE}" >> "$GITHUB_ENV"
          echo "BLUE_FILE=${BLUE_FILE}" >> "$GITHUB_ENV"
          echo "GREEN_FILE=${GREEN_FILE}" >> "$GITHUB_ENV"

          echo ""
          echo "=================================================="
          echo "GITOPS CONFIGURATION"
          echo "=================================================="

          echo "Environment  : ${TARGET_ENV}"
          echo "Namespace    : ${NAMESPACE}"
          echo "Service File : ${SERVICE_FILE}"
          echo "Blue File    : ${BLUE_FILE}"
          echo "Green File   : ${GREEN_FILE}"


      # ============================================================
      # 4. VALIDATE GITOPS MANIFESTS
      # ============================================================

      - name: Validate GitOps manifests
        shell: bash
        run: |
          set -euo pipefail

          for FILE in \
            "${SERVICE_FILE}" \
            "${BLUE_FILE}" \
            "${GREEN_FILE}"
          do

            if [[ ! -f "${FILE}" ]]; then
              echo "ERROR: Missing file: ${FILE}"
              exit 1
            fi

            echo "Found: ${FILE}"

          done

          echo ""
          echo "All required GitOps manifests exist."


      # ============================================================
      # 5. UPDATE IMAGE TAG
      # ============================================================

      - name: Update image tags
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${BLUE_FILE}"

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${GREEN_FILE}"

          echo ""
          echo "=================================================="
          echo "IMAGE TAG CONFIGURATION"
          echo "=================================================="

          echo "BLUE  = ${IMAGE_TAG}"
          echo "GREEN = ${IMAGE_TAG}"


      # ============================================================
      # 6. CONFIGURE BLUE/GREEN REPLICAS
      # ============================================================

      - name: Configure blue green replicas
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_COLOR}" == "blue" ]]; then

            # BLUE = ACTIVE
            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${BLUE_FILE}"

            # GREEN = INACTIVE
            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${GREEN_FILE}"

          else

            # BLUE = INACTIVE
            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${BLUE_FILE}"

            # GREEN = ACTIVE
            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${GREEN_FILE}"

          fi

          echo ""
          echo "=================================================="
          echo "REPLICA CONFIGURATION"
          echo "=================================================="

          echo "BLUE replicas:"
          grep -n "replicas:" "${BLUE_FILE}"

          echo ""

          echo "GREEN replicas:"
          grep -n "replicas:" "${GREEN_FILE}"


      # ============================================================
      # 7. CONFIGURE TRAFFIC SWITCH
      # ============================================================

      - name: Configure traffic switch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            echo ""
            echo "Traffic switch requested."
            echo "Switching Service selector to: ${TARGET_COLOR}"

            sed -i -E \
              "s/(color:)[[:space:]]*(blue|green)/\1 ${TARGET_COLOR}/" \
              "${SERVICE_FILE}"

          else

            echo ""
            echo "Traffic switch NOT requested."
            echo "Existing Service selector will remain unchanged."

          fi

          echo ""
          echo "Service selector in GitOps:"

          grep -A3 "selector:" "${SERVICE_FILE}"


      # ============================================================
      # 8. SHOW FINAL GITOPS CONFIGURATION
      # ============================================================

      - name: Show rendered GitOps configuration
        shell: bash
        run: |

          echo ""
          echo "=================================================="
          echo "BLUE MANIFEST"
          echo "=================================================="

          cat "${BLUE_FILE}"

          echo ""
          echo "=================================================="
          echo "GREEN MANIFEST"
          echo "=================================================="

          cat "${GREEN_FILE}"

          echo ""
          echo "=================================================="
          echo "SERVICE MANIFEST"
          echo "=================================================="

          cat "${SERVICE_FILE}"


      # ============================================================
      # 9. COMMIT GITOPS CHANGE
      # ============================================================

      - name: Commit GitOps change
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${BLUE_FILE}" \
            "${GREEN_FILE}" \
            "${SERVICE_FILE}"

          if git diff --cached --quiet; then

            echo "No GitOps changes detected."

          else

            git commit \
              -m "deploy: ${TARGET_ENV} ${TARGET_COLOR} ${IMAGE_TAG}"

            git push

          fi

          GITOPS_SHA=$(git rev-parse HEAD)

          echo ""
          echo "GitOps commit SHA:"
          echo "${GITOPS_SHA}"

          echo "GITOPS_SHA=${GITOPS_SHA}" >> "$GITHUB_ENV"


      # ============================================================
      # 10. AUTHENTICATE TO GCP
      # ============================================================

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ============================================================
      # 11. GET GKE CREDENTIALS
      # ============================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}


      # ============================================================
      # 12. VERIFY GKE
      # ============================================================

      - name: Verify GKE
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "GKE CLUSTER"
          echo "=================================================="

          kubectl cluster-info

          echo ""

          kubectl get nodes


      # ============================================================
      # 13. REFRESH ARGO CD
      # ============================================================

      - name: Refresh Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n argocd annotate application ai-sre-platform \
            argocd.argoproj.io/refresh=hard \
            --overwrite


      # ============================================================
      # 14. WAIT FOR ARGO CD
      # ============================================================

      - name: Wait for Argo CD GitOps revision
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "WAITING FOR ARGO CD"
          echo "=================================================="

          echo "Expected GitOps revision:"
          echo "${GITOPS_SHA}"

          for i in {1..60}; do

            SYNC_REVISION=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)

            SYNC_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            echo ""
            echo "Attempt ${i}/60"
            echo "Sync revision : ${SYNC_REVISION}"
            echo "Sync status   : ${SYNC_STATUS}"
            echo "Health status : ${HEALTH_STATUS}"

            if [[ "${SYNC_REVISION}" == "${GITOPS_SHA}" &&
                  "${SYNC_STATUS}" == "Synced" &&
                  "${HEALTH_STATUS}" == "Healthy" ]]; then

              echo ""
              echo "SUCCESS: Argo CD is synced to the new GitOps commit."

              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: Argo CD did not reach expected GitOps revision."
          echo "Expected: ${GITOPS_SHA}"

          exit 1


      # ============================================================
      # 15. VERIFY TARGET DEPLOYMENT
      # ============================================================

      - name: Verify target deployment
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DEPLOYMENT="payment-service-${TARGET_COLOR}"

          REPLICAS=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')

          IMAGE=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo ""
          echo "=================================================="
          echo "TARGET DEPLOYMENT"
          echo "=================================================="

          echo "Deployment        : ${TARGET_DEPLOYMENT}"
          echo "Expected replicas : 1"
          echo "Actual replicas   : ${REPLICAS}"
          echo "Expected image    : ${IMAGE_TAG}"
          echo "Actual image      : ${IMAGE}"

          if [[ "${REPLICAS}" != "1" ]]; then

            echo "ERROR: Target deployment does not have 1 replica."

            exit 1
          fi

          if [[ "${IMAGE}" != *":${IMAGE_TAG}" ]]; then

            echo "ERROR: Target deployment has incorrect image."

            exit 1
          fi

          echo ""
          echo "Target deployment specification is correct."


      # ============================================================
      # 16. VERIFY INACTIVE DEPLOYMENT
      # ============================================================

      - name: Verify inactive deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_COLOR}" == "blue" ]]; then
            INACTIVE_COLOR="green"
          else
            INACTIVE_COLOR="blue"
          fi

          INACTIVE_DEPLOYMENT="payment-service-${INACTIVE_COLOR}"

          REPLICAS=$(kubectl get deployment "${INACTIVE_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')

          IMAGE=$(kubectl get deployment "${INACTIVE_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo ""
          echo "=================================================="
          echo "INACTIVE DEPLOYMENT"
          echo "=================================================="

          echo "Deployment : ${INACTIVE_DEPLOYMENT}"
          echo "Replicas   : ${REPLICAS}"
          echo "Image      : ${IMAGE}"

          if [[ "${REPLICAS}" != "0" ]]; then

            echo "ERROR: Inactive deployment must have 0 replicas."

            exit 1
          fi

          if [[ "${IMAGE}" != *":${IMAGE_TAG}" ]]; then

            echo "ERROR: Inactive deployment does not have expected image tag."

            exit 1
          fi

          echo ""
          echo "Inactive deployment is correctly configured."


      # ============================================================
      # 17. WAIT FOR TARGET POD
      # ============================================================

      - name: Wait for target pod readiness
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "WAITING FOR TARGET POD"
          echo "=================================================="

          echo "Environment : ${TARGET_ENV}"
          echo "Color       : ${TARGET_COLOR}"

          kubectl wait \
            --namespace "${NAMESPACE}" \
            --for=condition=ready \
            pod \
            -l "app=payment-service,color=${TARGET_COLOR}" \
            --timeout=180s

          echo ""
          echo "Target pod is Ready."


      # ============================================================
      # 18. VERIFY PODS
      # ============================================================

      - name: Verify pods
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "PAYMENT SERVICE PODS"
          echo "=================================================="

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l app=payment-service \
            -o wide


      # ============================================================
      # 19. VERIFY SERVICE TRAFFIC
      # ============================================================

      - name: Verify service traffic
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_COLOR=$(kubectl get service payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          echo ""
          echo "=================================================="
          echo "SERVICE TRAFFIC"
          echo "=================================================="

          echo "Expected color: ${TARGET_COLOR}"
          echo "Actual color  : ${ACTUAL_COLOR}"

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            if [[ "${ACTUAL_COLOR}" != "${TARGET_COLOR}" ]]; then

              echo "ERROR: Service is NOT pointing to target color."

              exit 1
            fi

            echo ""
            echo "Traffic successfully switched to ${TARGET_COLOR}."

          else

            echo ""
            echo "Traffic switch was not requested."
            echo "Existing Service selector remains: ${ACTUAL_COLOR}"

          fi


      # ============================================================
      # 20. FINAL DEPLOYMENT STATUS
      # ============================================================

      - name: Final deployment status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_COLOR}" == "blue" ]]; then
            INACTIVE_COLOR="green"
          else
            INACTIVE_COLOR="blue"
          fi

          ACTUAL_COLOR=$(kubectl get service payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          echo ""
          echo "=================================================="
          echo "       BLUE-GREEN DEPLOYMENT COMPLETE"
          echo "=================================================="

          echo ""
          echo "Environment : ${TARGET_ENV^^}"
          echo "Image       : ${IMAGE_TAG}"
          echo "Active Color: ${ACTUAL_COLOR^^}"
          echo "Traffic     : 100% ${ACTUAL_COLOR^^}"
          echo "Namespace   : ${NAMESPACE}"
          echo "GitOps SHA  : ${GITOPS_SHA}"

          echo ""
          echo "=================================================="
          echo "ACTIVE: ${TARGET_ENV^^}-${ACTUAL_COLOR^^}"
          echo "=================================================="

          kubectl get deployment \
            "payment-service-${ACTUAL_COLOR}" \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "Pods:"

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l "app=payment-service,color=${ACTUAL_COLOR}" \
            -o wide

          echo ""
          echo "=================================================="
          echo "INACTIVE: ${TARGET_ENV^^}-${INACTIVE_COLOR^^}"
          echo "=================================================="

          kubectl get deployment \
            "payment-service-${INACTIVE_COLOR}" \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "Pods:"

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l "app=payment-service,color=${INACTIVE_COLOR}" \
            -o wide \
            || true

          echo ""
          echo "=================================================="
          echo "FINAL SERVICE TRAFFIC"
          echo "=================================================="

          echo "Environment : ${TARGET_ENV^^}"
          echo "Service     : payment-service"
          echo "Active Color: ${ACTUAL_COLOR^^}"
          echo "Traffic     : 100% ${ACTUAL_COLOR^^}"

          echo ""
          echo "=================================================="
          echo "          ALL VALIDATIONS PASSED"
          echo "=================================================="
