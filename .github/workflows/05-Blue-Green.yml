name: 05 - Blue Green Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - pilot
          - fleet
      image_tag:
        description: "Image tag, e.g. v1.2.0"
        required: true
        type: string
        default: "v1.2.0"
      switch_traffic:
        description: "Promote preview to active after validation?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster

jobs:
  blue-green:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          }

          case "$TARGET_ENV" in
            stage)
              echo "NAMESPACE=payment-stage" >> "$GITHUB_ENV"
              echo "ARGO_APP=payment-service-stage" >> "$GITHUB_ENV"
              echo "VALUES_FILE=devops-infra/kubernetes/payment-service/helm/values-stage.yaml" >> "$GITHUB_ENV"
              ;;
            pilot)
              echo "NAMESPACE=payment-pilot" >> "$GITHUB_ENV"
              echo "ARGO_APP=payment-service-pilot" >> "$GITHUB_ENV"
              echo "VALUES_FILE=devops-infra/kubernetes/payment-service/helm/values-pilot.yaml" >> "$GITHUB_ENV"
              ;;
            fleet)
              echo "NAMESPACE=payment-prod" >> "$GITHUB_ENV"
              echo "ARGO_APP=payment-service-prod" >> "$GITHUB_ENV"
              echo "VALUES_FILE=devops-infra/kubernetes/payment-service/helm/values-prod.yaml" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENV"
              exit 1
              ;;
          esac

      - name: Update selected environment image tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["VALUES_FILE"])
          text = p.read_text()
          text, count = re.subn(
              r'(?m)^(  tag:\s*).*$',
              lambda m: m.group(1) + os.environ["IMAGE_TAG"],
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f"Could not update image tag in {p}")
          p.write_text(text)
          print(f"Updated {p} to {os.environ['IMAGE_TAG']}")
          PY

      - name: Commit and push GitOps change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then
            echo "Image tag is already set; no GitOps commit required."
          else
            git commit -m "deploy: ${TARGET_ENV} payment-service ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
          echo "GITOPS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Wait for Argo CD sync
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n argocd annotate application "$ARGO_APP" \
            argocd.argoproj.io/refresh=hard --overwrite

          READY=false
          for i in {1..60}; do
            SYNC=$(kubectl -n argocd get application "$ARGO_APP" \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl -n argocd get application "$ARGO_APP" \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            REV=$(kubectl -n argocd get application "$ARGO_APP" \
              -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)
            echo "Attempt $i: sync=$SYNC health=$HEALTH revision=$REV"

            if [[ "$SYNC" == "Synced" && "$HEALTH" == "Healthy" && "$REV" == "$GITOPS_SHA" ]]; then
              READY=true
              break
            fi
            sleep 10
          done

          [[ "$READY" == "true" ]] || {
            echo "Argo CD did not sync to the expected Git revision."
            kubectl -n argocd describe application "$ARGO_APP" || true
            exit 1
          }

      - name: Validate rollout preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          ROLLOUT=$(kubectl get rollouts -n "$NAMESPACE" \
            -o jsonpath='{.items[0].metadata.name}')
          [[ -n "$ROLLOUT" ]] || {
            echo "No Argo Rollout found in $NAMESPACE"
            exit 1
          }
          echo "name=$ROLLOUT" >> "$GITHUB_OUTPUT"

          PREVIEW_HASH=""
          for i in {1..18}; do
            PREVIEW_HASH=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.status.blueGreen.previewSelector}' 2>/dev/null || true)
            [[ -n "$PREVIEW_HASH" ]] && break
            sleep 10
          done

          [[ -n "$PREVIEW_HASH" ]] || {
            echo "Preview ReplicaSet not available."
            kubectl describe rollout "$ROLLOUT" -n "$NAMESPACE"
            exit 1
          }

          kubectl wait -n "$NAMESPACE" --for=condition=Ready pod \
            -l "rollouts-pod-template-hash=$PREVIEW_HASH" --timeout=180s

          ACTUAL=$(kubectl get pods -n "$NAMESPACE" \
            -l "rollouts-pod-template-hash=$PREVIEW_HASH" \
            -o jsonpath='{.items[0].spec.containers[0].image}')

          echo "Rollout: $ROLLOUT"
          echo "Preview image: $ACTUAL"
          [[ "$ACTUAL" == *":$IMAGE_TAG" ]] || {
            echo "Preview image does not match $IMAGE_TAG"
            exit 1
          }

      - name: Promote preview to active
        if: inputs.switch_traffic == 'yes'
        shell: bash
        env:
          ROLLOUT_NAME: ${{ steps.preview.outputs.name }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          sudo install /tmp/kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts
          chmod +x /usr/local/bin/kubectl-argo-rollouts

          kubectl argo rollouts promote "$ROLLOUT_NAME" -n "$NAMESPACE"
          kubectl argo rollouts get rollout "$ROLLOUT_NAME" -n "$NAMESPACE" --watch

      - name: Final status
        if: always()
        shell: bash
        run: |
          kubectl get rollouts,services,pods -n "$NAMESPACE" -o wide || true
