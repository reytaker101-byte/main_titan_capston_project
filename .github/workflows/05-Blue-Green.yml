name: 05 - Blue Green Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - pilot
          - fleet

      image_tag:
        description: "Image tag"
        required: true
        type: string

      target_color:
        description: "Color to deploy/activate"
        required: true
        type: choice
        options:
          - blue
          - green

      switch_traffic:
        description: "Switch traffic to target color?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster

jobs:

  blue-green:
    name: Blue Green Deployment
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment == 'fleet' && 'production' || '' }}

    env:
      TARGET_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_COLOR: ${{ inputs.target_color }}
      SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "BLUE-GREEN DEPLOYMENT INPUTS"
          echo "=================================================="

          echo "Environment    : ${TARGET_ENV}"
          echo "Image Tag      : ${IMAGE_TAG}"
          echo "Target Color   : ${TARGET_COLOR}"
          echo "Switch Traffic : ${SWITCH_TRAFFIC}"

          echo ""

          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag: ${IMAGE_TAG}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          if [[ "${TARGET_ENV}" != "stage" &&
                "${TARGET_ENV}" != "pilot" &&
                "${TARGET_ENV}" != "fleet" ]]; then
            echo "ERROR: Invalid environment"
            exit 1
          fi

          if [[ "${TARGET_COLOR}" != "blue" &&
                "${TARGET_COLOR}" != "green" ]]; then
            echo "ERROR: Invalid target color"
            exit 1
          fi

          if [[ "${SWITCH_TRAFFIC}" != "yes" &&
                "${SWITCH_TRAFFIC}" != "no" ]]; then
            echo "ERROR: switch_traffic must be yes or no"
            exit 1
          fi

          echo "Input validation passed."


      # ============================================================
      # 3. RESOLVE GITOPS FILES
      # ============================================================

      - name: Resolve GitOps files
        shell: bash
        run: |
          set -euo pipefail

          case "${TARGET_ENV}" in

            stage)
              NAMESPACE="ai-sre-stage"

              SERVICE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/stage-payment-service-green.yaml"
              ;;

            pilot)
              NAMESPACE="ai-sre-pilot"

              SERVICE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-green.yaml"
              ;;

            fleet)
              NAMESPACE="ai-sre-fleet"

              SERVICE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-green.yaml"
              ;;

          esac

          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"
          echo "SERVICE_FILE=${SERVICE_FILE}" >> "$GITHUB_ENV"
          echo "BLUE_FILE=${BLUE_FILE}" >> "$GITHUB_ENV"
          echo "GREEN_FILE=${GREEN_FILE}" >> "$GITHUB_ENV"

          echo ""
          echo "=================================================="
          echo "GITOPS CONFIGURATION"
          echo "=================================================="

          echo "Environment    : ${TARGET_ENV}"
          echo "Namespace      : ${NAMESPACE}"
          echo "Service File   : ${SERVICE_FILE}"
          echo "Blue File      : ${BLUE_FILE}"
          echo "Green File     : ${GREEN_FILE}"


      # ============================================================
      # 4. VALIDATE MANIFESTS
      # ============================================================

      - name: Validate GitOps manifests
        shell: bash
        run: |
          set -euo pipefail

          for FILE in \
            "${SERVICE_FILE}" \
            "${BLUE_FILE}" \
            "${GREEN_FILE}"
          do

            if [[ ! -f "${FILE}" ]]; then
              echo "ERROR: Missing file: ${FILE}"
              exit 1
            fi

            echo "Found: ${FILE}"

          done


      # ============================================================
      # 5. DETERMINE CURRENT ACTIVE COLOR
      # ============================================================

      - name: Determine current active color
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_COLOR="blue"

          if grep -qE "color:[[:space:]]*green" "${SERVICE_FILE}"; then
            CURRENT_COLOR="green"
          fi

          echo "CURRENT_COLOR=${CURRENT_COLOR}" >> "$GITHUB_ENV"

          if [[ "${CURRENT_COLOR}" == "blue" ]]; then
            CURRENT_INACTIVE_COLOR="green"
          else
            CURRENT_INACTIVE_COLOR="blue"
          fi

          echo "CURRENT_INACTIVE_COLOR=${CURRENT_INACTIVE_COLOR}" >> "$GITHUB_ENV"

          echo ""
          echo "=================================================="
          echo "CURRENT TRAFFIC STATE"
          echo "=================================================="

          echo "Current Active Color : ${CURRENT_COLOR}"
          echo "Current Inactive     : ${CURRENT_INACTIVE_COLOR}"


      # ============================================================
      # 6. UPDATE IMAGE TAGS
      # ============================================================

      - name: Update image tags
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${BLUE_FILE}"

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${GREEN_FILE}"

          echo ""
          echo "=================================================="
          echo "IMAGE TAGS"
          echo "=================================================="

          echo "BLUE  : ${IMAGE_TAG}"
          echo "GREEN : ${IMAGE_TAG}"


      # ============================================================
      # 7. SET REPLICAS
      #
      # switch_traffic=yes:
      #   target = active = 1
      #   other  = inactive = 0
      #
      # switch_traffic=no:
      #   existing active stays active = 1
      #   target candidate becomes inactive = 1
      #
      # This allows safe pre-deployment/testing.
      # ============================================================

      - name: Configure blue green replicas
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            echo "Traffic switch requested."

            if [[ "${TARGET_COLOR}" == "blue" ]]; then

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${BLUE_FILE}"

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
                "${GREEN_FILE}"

            else

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
                "${BLUE_FILE}"

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${GREEN_FILE}"

            fi

          else

            echo "Traffic switch NOT requested."
            echo "Keeping existing active color running."

            if [[ "${CURRENT_COLOR}" == "blue" ]]; then

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${BLUE_FILE}"

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${GREEN_FILE}"

            else

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${BLUE_FILE}"

              sed -i -E \
                's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
                "${GREEN_FILE}"

            fi

          fi

          echo ""
          echo "Replica configuration:"
          echo ""
          echo "BLUE:"
          grep -n "replicas:" "${BLUE_FILE}"

          echo ""
          echo "GREEN:"
          grep -n "replicas:" "${GREEN_FILE}"


      # ============================================================
      # 8. SET ARGOCD-FRIENDLY RESOURCE NAMES
      #
      # Examples:
      #
      # payment-service-pilot-blue-active
      # payment-service-pilot-green-inactive
      #
      # payment-service-fleet-blue-active
      # payment-service-fleet-green-inactive
      # ============================================================

      - name: Configure Argo CD resource names
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            if [[ "${TARGET_COLOR}" == "blue" ]]; then
              BLUE_STATE="active"
              GREEN_STATE="inactive"
            else
              BLUE_STATE="inactive"
              GREEN_STATE="active"
            fi

          else

            if [[ "${CURRENT_COLOR}" == "blue" ]]; then
              BLUE_STATE="active"
              GREEN_STATE="inactive"
            else
              BLUE_STATE="inactive"
              GREEN_STATE="active"
            fi

          fi

          BLUE_NAME="payment-service-${TARGET_ENV}-blue-${BLUE_STATE}"
          GREEN_NAME="payment-service-${TARGET_ENV}-green-${GREEN_STATE}"

          echo "BLUE_NAME=${BLUE_NAME}" >> "$GITHUB_ENV"
          echo "GREEN_NAME=${GREEN_NAME}" >> "$GITHUB_ENV"

          echo ""
          echo "=================================================="
          echo "ARGO CD RESOURCE NAMES"
          echo "=================================================="

          echo "BLUE  : ${BLUE_NAME}"
          echo "GREEN : ${GREEN_NAME}"

          # Replace Deployment metadata.name only.
          #
          # Keep labels/selectors unchanged:
          # app: payment-service
          # color: blue/green

          sed -i -E \
            "0,/^[[:space:]]*name:[[:space:]]*payment-service-[a-z]+-[a-z]+$/s//  name: ${BLUE_NAME}/" \
            "${BLUE_FILE}"

          sed -i -E \
            "0,/^[[:space:]]*name:[[:space:]]*payment-service-[a-z]+-[a-z]+$/s//  name: ${GREEN_NAME}/" \
            "${GREEN_FILE}"

          echo ""
          echo "BLUE deployment name:"
          grep -n -m1 "name:" "${BLUE_FILE}"

          echo ""
          echo "GREEN deployment name:"
          grep -n -m1 "name:" "${GREEN_FILE}"


      # ============================================================
      # 9. CONFIGURE SERVICE TRAFFIC
      # ============================================================

      - name: Configure traffic switch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            echo "Traffic switch requested."
            echo "Switching Service selector to: ${TARGET_COLOR}"

            sed -i -E \
              "s/(color:)[[:space:]]*(blue|green)/\1 ${TARGET_COLOR}/" \
              "${SERVICE_FILE}"

          else

            echo "Traffic switch NOT requested."
            echo "Keeping Service selector on: ${CURRENT_COLOR}"

          fi

          echo ""
          echo "Service selector:"
          grep -A3 "selector:" "${SERVICE_FILE}"


      # ============================================================
      # 10. SHOW FINAL GITOPS CONFIGURATION
      # ============================================================

      - name: Show rendered GitOps configuration
        shell: bash
        run: |

          echo ""
          echo "=================================================="
          echo "BLUE MANIFEST"
          echo "=================================================="

          cat "${BLUE_FILE}"

          echo ""
          echo "=================================================="
          echo "GREEN MANIFEST"
          echo "=================================================="

          cat "${GREEN_FILE}"

          echo ""
          echo "=================================================="
          echo "SERVICE MANIFEST"
          echo "=================================================="

          cat "${SERVICE_FILE}"


      # ============================================================
      # 11. COMMIT GITOPS CHANGE
      # ============================================================

      - name: Commit GitOps change
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${BLUE_FILE}" \
            "${GREEN_FILE}" \
            "${SERVICE_FILE}"

          if git diff --cached --quiet; then

            echo "No GitOps changes detected."

          else

            git commit \
              -m "deploy: ${TARGET_ENV} ${TARGET_COLOR} ${IMAGE_TAG}"

            git push

          fi

          GITOPS_SHA=$(git rev-parse HEAD)

          echo ""
          echo "GitOps Commit SHA:"
          echo "${GITOPS_SHA}"

          echo "GITOPS_SHA=${GITOPS_SHA}" >> "$GITHUB_ENV"


      # ============================================================
      # 12. GCP AUTH
      # ============================================================

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ============================================================
      # 13. GKE CREDENTIALS
      # ============================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}


      # ============================================================
      # 14. VERIFY GKE
      # ============================================================

      - name: Verify GKE
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info

          echo ""
          kubectl get nodes


      # ============================================================
      # 15. REFRESH ARGO CD
      # ============================================================

      - name: Refresh Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n argocd annotate application ai-sre-platform \
            argocd.argoproj.io/refresh=hard \
            --overwrite


      # ============================================================
      # 16. WAIT FOR ARGO CD
      # ============================================================

      - name: Wait for Argo CD GitOps revision
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "WAITING FOR ARGO CD"
          echo "=================================================="

          echo "Expected GitOps SHA:"
          echo "${GITOPS_SHA}"

          for i in {1..60}; do

            SYNC_REVISION=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.revision}' \
              2>/dev/null || true)

            SYNC_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.status}' \
              2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.health.status}' \
              2>/dev/null || true)

            echo ""
            echo "Attempt ${i}/60"
            echo "Sync revision : ${SYNC_REVISION}"
            echo "Sync status   : ${SYNC_STATUS}"
            echo "Health status : ${HEALTH_STATUS}"

            if [[ "${SYNC_REVISION}" == "${GITOPS_SHA}" &&
                  "${SYNC_STATUS}" == "Synced" &&
                  "${HEALTH_STATUS}" == "Healthy" ]]; then

              echo ""
              echo "SUCCESS: Argo CD is synced and healthy."
              exit 0

            fi

            sleep 10

          done

          echo ""
          echo "ERROR: Argo CD did not reach expected GitOps revision."
          echo "Expected: ${GITOPS_SHA}"

          exit 1


      # ============================================================
      # 17. VERIFY TARGET DEPLOYMENT
      # ============================================================

      - name: Verify target deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then
            TARGET_DEPLOYMENT="${TARGET_COLOR == 'blue' && BLUE_NAME || GREEN_NAME}"
          else
            if [[ "${TARGET_COLOR}" == "blue" ]]; then
              TARGET_DEPLOYMENT="${BLUE_NAME}"
            else
              TARGET_DEPLOYMENT="${GREEN_NAME}"
            fi
          fi

          echo ""
          echo "=================================================="
          echo "TARGET DEPLOYMENT"
          echo "=================================================="

          echo "Deployment : ${TARGET_DEPLOYMENT}"

          REPLICAS=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')

          IMAGE=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "Replicas   : ${REPLICAS}"
          echo "Image      : ${IMAGE}"

          if [[ "${IMAGE}" != *":${IMAGE_TAG}" ]]; then
            echo "ERROR: Incorrect image tag."
            exit 1
          fi

          echo "Target deployment image verified."


      # ============================================================
      # 18. WAIT FOR TARGET POD
      # ============================================================

      - name: Wait for target pod readiness
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "Waiting for target payment-service pod..."

          kubectl wait \
            --namespace "${NAMESPACE}" \
            --for=condition=ready \
            pod \
            -l "app=payment-service,color=${TARGET_COLOR}" \
            --timeout=180s

          echo "Target pod is Ready."


      # ============================================================
      # 19. VERIFY PODS
      # ============================================================

      - name: Verify pods
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "PAYMENT SERVICE PODS"
          echo "=================================================="

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l app=payment-service \
            -o wide


      # ============================================================
      # 20. VERIFY SERVICE TRAFFIC
      # ============================================================

      - name: Verify service traffic
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_COLOR=$(kubectl get service payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          echo ""
          echo "=================================================="
          echo "SERVICE TRAFFIC"
          echo "=================================================="

          echo "Expected Color : ${TARGET_COLOR}"
          echo "Actual Color   : ${ACTUAL_COLOR}"

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            if [[ "${ACTUAL_COLOR}" != "${TARGET_COLOR}" ]]; then
              echo "ERROR: Service is NOT pointing to target color."
              exit 1
            fi

            echo "Traffic successfully switched to ${TARGET_COLOR}."

          else

            if [[ "${ACTUAL_COLOR}" != "${CURRENT_COLOR}" ]]; then
              echo "ERROR: Existing traffic was unexpectedly changed."
              exit 1
            fi

            echo "Traffic remains on existing active color: ${CURRENT_COLOR}"

          fi


      # ============================================================
      # 21. FINAL DEPLOYMENT STATUS
      # ============================================================

      - name: Final deployment status
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_COLOR=$(kubectl get service payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          if [[ "${ACTUAL_COLOR}" == "blue" ]]; then
            ACTIVE_NAME="${BLUE_NAME}"
            INACTIVE_NAME="${GREEN_NAME}"
          else
            ACTIVE_NAME="${GREEN_NAME}"
            INACTIVE_NAME="${BLUE_NAME}"
          fi

          echo ""
          echo "=================================================="
          echo "       BLUE-GREEN DEPLOYMENT COMPLETE"
          echo "=================================================="

          echo "Environment    : ${TARGET_ENV^^}"
          echo "Image          : ${IMAGE_TAG}"
          echo "Traffic        : 100% ${ACTUAL_COLOR^^}"
          echo "Namespace      : ${NAMESPACE}"
          echo "GitOps SHA     : ${GITOPS_SHA}"

          echo ""
          echo "=================================================="
          echo "ACTIVE"
          echo "=================================================="

          echo "Resource : ${ACTIVE_NAME}"

          kubectl get deployment "${ACTIVE_NAME}" \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "Pods:"

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l "app=payment-service,color=${ACTUAL_COLOR}" \
            -o wide

          echo ""
          echo "=================================================="
          echo "INACTIVE"
          echo "=================================================="

          echo "Resource : ${INACTIVE_NAME}"

          kubectl get deployment "${INACTIVE_NAME}" \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "Pods:"

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l "app=payment-service,color=$([[ "${ACTUAL_COLOR}" == "blue" ]] && echo green || echo blue)" \
            -o wide \
            || true

          echo ""
          echo "=================================================="
          echo "ARGO CD RESOURCE NAMES"
          echo "=================================================="

          echo "ACTIVE   : ${ACTIVE_NAME}"
          echo "INACTIVE : ${INACTIVE_NAME}"

          echo ""
          echo "=================================================="
          echo "          ALL VALIDATIONS PASSED"
          echo "=================================================="
