name: 05 - Blue Green Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - pilot
          - fleet

      image_tag:
        description: "Image tag"
        required: true
        type: string

      target_color:
        description: "Color to deploy/activate"
        required: true
        type: choice
        options:
          - blue
          - green

      switch_traffic:
        description: "Switch traffic to target color"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster

jobs:

  blue-green:
    name: Blue Green Deployment
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment == 'fleet' && 'production' || '' }}

    env:
      TARGET_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_COLOR: ${{ inputs.target_color }}
      SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Validate inputs
      # ------------------------------------------------------------
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Environment     : ${TARGET_ENV}"
          echo "Image Tag       : ${IMAGE_TAG}"
          echo "Target Color    : ${TARGET_COLOR}"
          echo "Switch Traffic  : ${SWITCH_TRAFFIC}"

          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag: ${IMAGE_TAG}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          if [[ "${TARGET_ENV}" != "stage" &&
                "${TARGET_ENV}" != "pilot" &&
                "${TARGET_ENV}" != "fleet" ]]; then
            echo "ERROR: Invalid environment"
            exit 1
          fi

          if [[ "${TARGET_COLOR}" != "blue" &&
                "${TARGET_COLOR}" != "green" ]]; then
            echo "ERROR: Invalid target color"
            exit 1
          fi

      # ------------------------------------------------------------
      # 3. Resolve environment-specific files
      # ------------------------------------------------------------
      - name: Resolve GitOps files
        shell: bash
        run: |
          set -euo pipefail

          case "${TARGET_ENV}" in

            stage)
              NAMESPACE="ai-sre-stage"
              SERVICE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/stage-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/stage-payment-service-green.yaml"
              ;;

            pilot)
              NAMESPACE="ai-sre-pilot"
              SERVICE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/pilot-payment-service-green.yaml"
              ;;

            fleet)
              NAMESPACE="ai-sre-fleet"
              SERVICE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-service.yaml"
              BLUE_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-blue.yaml"
              GREEN_FILE="devops-infra/kubernetes/manifests/fleet-payment-service-green.yaml"
              ;;

          esac

          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"
          echo "SERVICE_FILE=${SERVICE_FILE}" >> "$GITHUB_ENV"
          echo "BLUE_FILE=${BLUE_FILE}" >> "$GITHUB_ENV"
          echo "GREEN_FILE=${GREEN_FILE}" >> "$GITHUB_ENV"

          echo ""
          echo "Resolved configuration:"
          echo "NAMESPACE    = ${NAMESPACE}"
          echo "SERVICE_FILE = ${SERVICE_FILE}"
          echo "BLUE_FILE    = ${BLUE_FILE}"
          echo "GREEN_FILE   = ${GREEN_FILE}"

      # ------------------------------------------------------------
      # 4. Validate manifests exist
      # ------------------------------------------------------------
      - name: Validate GitOps manifests
        shell: bash
        run: |
          set -euo pipefail

          for FILE in \
            "${SERVICE_FILE}" \
            "${BLUE_FILE}" \
            "${GREEN_FILE}"
          do
            if [[ ! -f "${FILE}" ]]; then
              echo "ERROR: Missing file: ${FILE}"
              exit 1
            fi

            echo "Found: ${FILE}"
          done

      # ------------------------------------------------------------
      # 5. Update both BLUE and GREEN image tags
      # ------------------------------------------------------------
      - name: Update image tags
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${BLUE_FILE}"

          sed -i -E \
            "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${GREEN_FILE}"

          echo "Updated image tag to ${IMAGE_TAG} in:"
          echo "  ${BLUE_FILE}"
          echo "  ${GREEN_FILE}"

      # ------------------------------------------------------------
      # 6. Configure BLUE/GREEN replicas
      #
      # Target color = 1 replica
      # Other color  = 0 replicas
      # ------------------------------------------------------------
      - name: Configure blue green replicas
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_COLOR}" == "blue" ]]; then

            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${BLUE_FILE}"

            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${GREEN_FILE}"

          else

            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${BLUE_FILE}"

            sed -i -E \
              's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${GREEN_FILE}"

          fi

          echo "Configured replicas:"
          echo ""
          echo "BLUE:"
          grep -n "replicas:" "${BLUE_FILE}"

          echo ""
          echo "GREEN:"
          grep -n "replicas:" "${GREEN_FILE}"

      # ------------------------------------------------------------
      # 7. Switch Service traffic if requested
      # ------------------------------------------------------------
      - name: Configure traffic switch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SWITCH_TRAFFIC}" == "true" ]]; then

            echo "Traffic switch requested."
            echo "Switching Service selector to: ${TARGET_COLOR}"

            sed -i -E \
              "s/(color:)[[:space:]]*(blue|green)/\1 ${TARGET_COLOR}/" \
              "${SERVICE_FILE}"

          else

            echo "Traffic switch NOT requested."
            echo "Service selector will remain unchanged."

          fi

          echo ""
          echo "Current Service selector:"
          grep -A3 "selector:" "${SERVICE_FILE}"

      # ------------------------------------------------------------
      # 8. Show final GitOps manifests
      # ------------------------------------------------------------
      - name: Show rendered GitOps configuration
        shell: bash
        run: |
          echo ""
          echo "========== BLUE =========="
          cat "${BLUE_FILE}"

          echo ""
          echo "========== GREEN =========="
          cat "${GREEN_FILE}"

          echo ""
          echo "========== SERVICE =========="
          cat "${SERVICE_FILE}"

      # ------------------------------------------------------------
      # 9. Commit and push GitOps change
      # ------------------------------------------------------------
      - name: Commit GitOps change
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${BLUE_FILE}" \
            "${GREEN_FILE}" \
            "${SERVICE_FILE}"

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
          else
            git commit \
              -m "deploy: ${TARGET_ENV} ${TARGET_COLOR} ${IMAGE_TAG}"

            git push
          fi

          # IMPORTANT:
          # This is the Git commit containing the GitOps change.
          GITOPS_SHA=$(git rev-parse HEAD)

          echo ""
          echo "GitOps commit SHA:"
          echo "${GITOPS_SHA}"

          echo "GITOPS_SHA=${GITOPS_SHA}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 10. Authenticate to GCP
      # ------------------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ------------------------------------------------------------
      # 11. Get GKE credentials
      # ------------------------------------------------------------
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ------------------------------------------------------------
      # 12. Verify cluster connectivity
      # ------------------------------------------------------------
      - name: Verify GKE
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info

          echo ""
          kubectl get nodes

      # ------------------------------------------------------------
      # 13. Force Argo CD refresh
      # ------------------------------------------------------------
      - name: Refresh Argo CD
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting Argo CD hard refresh..."

          kubectl -n argocd annotate application ai-sre-platform \
            argocd.argoproj.io/refresh=hard \
            --overwrite

      # ------------------------------------------------------------
      # 14. WAIT for Argo CD to sync EXACT Git commit
      # ------------------------------------------------------------
      - name: Wait for Argo CD GitOps revision
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD to process Git commit:"
          echo "${GITOPS_SHA}"

          for i in {1..60}; do

            SYNC_REVISION=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)

            SYNC_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            echo ""
            echo "Attempt ${i}/60"
            echo "Sync revision : ${SYNC_REVISION}"
            echo "Sync status   : ${SYNC_STATUS}"
            echo "Health status : ${HEALTH_STATUS}"

            if [[ "${SYNC_REVISION}" == "${GITOPS_SHA}" &&
                  "${SYNC_STATUS}" == "Synced" &&
                  "${HEALTH_STATUS}" == "Healthy" ]]; then

              echo ""
              echo "Argo CD is synced to the NEW GitOps commit."
              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: Argo CD did not reach the expected GitOps revision."
          echo "Expected:"
          echo "${GITOPS_SHA}"

          exit 1

      # ------------------------------------------------------------
      # 15. Verify TARGET deployment spec
      # ------------------------------------------------------------
      - name: Verify target deployment
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DEPLOYMENT="payment-service-${TARGET_COLOR}"

          echo "Checking deployment:"
          echo "${TARGET_DEPLOYMENT}"

          REPLICAS=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')

          IMAGE=$(kubectl get deployment "${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo ""
          echo "Expected replicas : 1"
          echo "Actual replicas   : ${REPLICAS}"

          echo ""
          echo "Expected image tag: ${IMAGE_TAG}"
          echo "Actual image      : ${IMAGE}"

          if [[ "${REPLICAS}" != "1" ]]; then
            echo ""
            echo "ERROR: Target deployment does not have 1 replica."
            exit 1
          fi

          if [[ "${IMAGE}" != *":${IMAGE_TAG}" ]]; then
            echo ""
            echo "ERROR: Target deployment has incorrect image."
            exit 1
          fi

          echo ""
          echo "Target deployment specification is correct."

      # ------------------------------------------------------------
      # 16. Verify INACTIVE deployment
      # ------------------------------------------------------------
      - name: Verify inactive deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_COLOR}" == "blue" ]]; then
            INACTIVE_COLOR="green"
          else
            INACTIVE_COLOR="blue"
          fi

          INACTIVE_DEPLOYMENT="payment-service-${INACTIVE_COLOR}"

          REPLICAS=$(kubectl get deployment "${INACTIVE_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.replicas}')

          IMAGE=$(kubectl get deployment "${INACTIVE_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "Inactive deployment : ${INACTIVE_DEPLOYMENT}"
          echo "Replicas            : ${REPLICAS}"
          echo "Image               : ${IMAGE}"

          if [[ "${REPLICAS}" != "0" ]]; then
            echo ""
            echo "ERROR: Inactive deployment must have 0 replicas."
            exit 1
          fi

          if [[ "${IMAGE}" != *":${IMAGE_TAG}" ]]; then
            echo ""
            echo "ERROR: Inactive deployment does not have expected image tag."
            exit 1
          fi

          echo ""
          echo "Inactive deployment is correctly configured."

      # ------------------------------------------------------------
      # 17. Wait for TARGET pod to become Ready
      # ------------------------------------------------------------
      - name: Wait for target pod readiness
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for ${TARGET_COLOR} payment-service pod..."

          kubectl wait \
            --namespace "${NAMESPACE}" \
            --for=condition=ready \
            pod \
            -l "app=payment-service,color=${TARGET_COLOR}" \
            --timeout=180s

          echo ""
          echo "Target pod is Ready."

      # ------------------------------------------------------------
      # 18. Verify actual pods
      # ------------------------------------------------------------
      - name: Verify pods
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "========== PODS =========="

          kubectl get pods \
            -n "${NAMESPACE}" \
            -l app=payment-service \
            -o wide

      # ------------------------------------------------------------
      # 19. Verify Service traffic selector
      # ------------------------------------------------------------
      - name: Verify service traffic
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_COLOR=$(kubectl get service payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          echo "Expected color: ${TARGET_COLOR}"
          echo "Actual color  : ${ACTUAL_COLOR}"

          if [[ "${SWITCH_TRAFFIC}" == "true" ]]; then

            if [[ "${ACTUAL_COLOR}" != "${TARGET_COLOR}" ]]; then
              echo ""
              echo "ERROR: Service is NOT pointing to target color."
              exit 1
            fi

            echo ""
            echo "Traffic successfully switched to ${TARGET_COLOR}."

          else

            echo ""
            echo "Traffic switch was not requested."

          fi

      # ------------------------------------------------------------
      # 20. Final deployment status
      # ------------------------------------------------------------
      - name: Final deployment status
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "        BLUE-GREEN DEPLOYMENT COMPLETE"
          echo "=================================================="

          echo "Environment : ${TARGET_ENV}"
          echo "Image       : ${IMAGE_TAG}"
          echo "Target Color: ${TARGET_COLOR}"
          echo "Traffic     : ${SWITCH_TRAFFIC}"
          echo "Namespace   : ${NAMESPACE}"
          echo "GitOps SHA  : ${GITOPS_SHA}"

          echo ""
          echo "Deployments:"
          kubectl get deployments \
            -n "${NAMESPACE}" \
            -l app=payment-service

          echo ""
          echo "Pods:"
          kubectl get pods \
            -n "${NAMESPACE}" \
            -l app=payment-service

          echo ""
          echo "Service:"
          kubectl get service payment-service \
            -n "${NAMESPACE}"

          echo ""
          echo "=================================================="
          echo "        ALL VALIDATIONS PASSED"
          echo "=================================================="
