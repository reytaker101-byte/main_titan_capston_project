name: 05 - Blue Green Deployment

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - stage
          - pilot
          - fleet

      image_tag:
        description: "Image tag"
        required: true
        type: string

      target_color:
        description: "Active color"
        required: true
        type: choice
        options:
          - blue
          - green

      switch_traffic:
        description: "Switch traffic to target color?"
        required: true
        type: choice
        options:
          - yes
          - no

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GKE_CLUSTER: main-titan-capston-project-cluster

jobs:

  blue-green:

    name: Blue Green - ${{ inputs.environment }}

    runs-on: ubuntu-latest

    # Production approval for FLEET
    environment: ${{ inputs.environment == 'fleet' && 'production' || '' }}

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_COLOR: ${{ inputs.target_color }}
      SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. VALIDATE INPUT
      # =========================================================

      - name: Validate input
        shell: bash
        run: |
          set -e

          echo "Environment : ${ENVIRONMENT}"
          echo "Image Tag   : ${IMAGE_TAG}"
          echo "Target Color: ${TARGET_COLOR}"
          echo "Switch      : ${SWITCH_TRAFFIC}"

          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag ${IMAGE_TAG}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

      # =========================================================
      # 3. SET ENVIRONMENT PATHS
      # =========================================================

      - name: Set environment paths
        shell: bash
        run: |

          case "${ENVIRONMENT}" in

            stage)

              echo "NAMESPACE=ai-sre-stage" >> "$GITHUB_ENV"

              echo "SERVICE_FILE=devops-infra/kubernetes/manifests/stage-payment-service-service.yaml" >> "$GITHUB_ENV"

              echo "BLUE_FILE=devops-infra/kubernetes/manifests/stage-payment-service-blue.yaml" >> "$GITHUB_ENV"

              echo "GREEN_FILE=devops-infra/kubernetes/manifests/stage-payment-service-green.yaml" >> "$GITHUB_ENV"

              ;;

            pilot)

              echo "NAMESPACE=ai-sre-pilot" >> "$GITHUB_ENV"

              echo "SERVICE_FILE=devops-infra/kubernetes/manifests/pilot-payment-service-service.yaml" >> "$GITHUB_ENV"

              echo "BLUE_FILE=devops-infra/kubernetes/manifests/pilot-payment-service-blue.yaml" >> "$GITHUB_ENV"

              echo "GREEN_FILE=devops-infra/kubernetes/manifests/pilot-payment-service-green.yaml" >> "$GITHUB_ENV"

              ;;

            fleet)

              echo "NAMESPACE=ai-sre-fleet" >> "$GITHUB_ENV"

              echo "SERVICE_FILE=devops-infra/kubernetes/manifests/fleet-payment-service-service.yaml" >> "$GITHUB_ENV"

              echo "BLUE_FILE=devops-infra/kubernetes/manifests/fleet-payment-service-blue.yaml" >> "$GITHUB_ENV"

              echo "GREEN_FILE=devops-infra/kubernetes/manifests/fleet-payment-service-green.yaml" >> "$GITHUB_ENV"

              ;;

            *)

              echo "ERROR: Invalid environment"
              exit 1

              ;;

          esac

      # =========================================================
      # 4. VERIFY FILES EXIST
      # =========================================================

      - name: Verify GitOps files
        shell: bash
        run: |

          set -e

          echo "Checking GitOps files..."

          test -f "${BLUE_FILE}"
          test -f "${GREEN_FILE}"
          test -f "${SERVICE_FILE}"

          echo "All required files exist."

      # =========================================================
      # 5. UPDATE IMAGE TAG
      # =========================================================

      - name: Update image tag
        shell: bash
        run: |

          set -e

          echo "Updating BLUE image to ${IMAGE_TAG}"
          echo "Updating GREEN image to ${IMAGE_TAG}"

          sed -i \
            -E "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${BLUE_FILE}"

          sed -i \
            -E "s|(image: .*payment-service:).*|\1${IMAGE_TAG}|" \
            "${GREEN_FILE}"

      # =========================================================
      # 6. CONFIGURE BLUE / GREEN REPLICAS
      # =========================================================

      - name: Configure active and inactive colors
        shell: bash
        run: |

          set -e

          if [[ "${TARGET_COLOR}" == "blue" ]]; then

            echo "BLUE = ACTIVE"
            echo "GREEN = INACTIVE"

            sed -i \
              -E 's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${BLUE_FILE}"

            sed -i \
              -E 's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${GREEN_FILE}"

          else

            echo "GREEN = ACTIVE"
            echo "BLUE = INACTIVE"

            sed -i \
              -E 's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 0/' \
              "${BLUE_FILE}"

            sed -i \
              -E 's/^([[:space:]]*replicas:)[[:space:]]*[0-9]+/\1 1/' \
              "${GREEN_FILE}"

          fi

      # =========================================================
      # 7. SWITCH SERVICE TRAFFIC
      # =========================================================

      - name: Switch service traffic
        if: ${{ inputs.switch_traffic == 'yes' }}
        shell: bash
        run: |

          set -e

          echo "Switching payment-service traffic to ${TARGET_COLOR}"

          sed -i \
            -E "s/(color:)[[:space:]]*(blue|green)/\1 ${TARGET_COLOR}/" \
            "${SERVICE_FILE}"

          echo "Service selector updated."

      # =========================================================
      # 8. SHOW CHANGES
      # =========================================================

      - name: Show GitOps changes
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "BLUE DEPLOYMENT"
          echo "=========================================="

          cat "${BLUE_FILE}"

          echo ""
          echo "=========================================="
          echo "GREEN DEPLOYMENT"
          echo "=========================================="

          cat "${GREEN_FILE}"

          echo ""
          echo "=========================================="
          echo "SERVICE"
          echo "=========================================="

          cat "${SERVICE_FILE}"

      # =========================================================
      # 9. COMMIT GITOPS CHANGES
      # =========================================================

      - name: Commit GitOps changes
        shell: bash
        run: |

          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${BLUE_FILE}" \
            "${GREEN_FILE}" \
            "${SERVICE_FILE}"

          if git diff --cached --quiet; then

            echo "No GitOps changes detected."

          else

            git commit \
              -m "deploy: ${ENVIRONMENT} ${TARGET_COLOR} ${IMAGE_TAG}"

            git push

          fi

      # =========================================================
      # 10. AUTHENTICATE TO GCP
      # =========================================================

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # =========================================================
      # 11. GET GKE CREDENTIALS
      # =========================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # =========================================================
      # 12. WAIT FOR ARGO CD
      # =========================================================

      - name: Wait for Argo CD
        shell: bash
        run: |

          set -e

          echo "Waiting for Argo CD to sync Git changes..."

          for i in {1..36}; do

            SYNC_STATUS=$(kubectl get application \
              ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.sync.status}' \
              2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application \
              ai-sre-platform \
              -n argocd \
              -o jsonpath='{.status.health.status}' \
              2>/dev/null || true)

            echo "Attempt ${i}: Sync=${SYNC_STATUS}, Health=${HEALTH_STATUS}"

            if [[ "${SYNC_STATUS}" == "Synced" && \
                  "${HEALTH_STATUS}" == "Healthy" ]]; then

              echo "Argo CD is Synced and Healthy."
              exit 0

            fi

            sleep 10

          done

          echo "ERROR: Argo CD did not become Synced and Healthy."
          exit 1

      # =========================================================
      # 13. VERIFY TARGET DEPLOYMENT
      # =========================================================

      - name: Verify target deployment
        shell: bash
        run: |

          set -e

          TARGET_DEPLOYMENT="payment-service-${TARGET_COLOR}"

          echo "Checking deployment:"
          echo "${TARGET_DEPLOYMENT}"

          kubectl rollout status \
            deployment/"${TARGET_DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            --timeout=300s

      # =========================================================
      # 14. VERIFY PODS
      # =========================================================

      - name: Verify deployments and pods
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "DEPLOYMENTS"
          echo "=========================================="

          kubectl get deployments \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n "${NAMESPACE}" \
            -o wide

      # =========================================================
      # 15. VERIFY SERVICE TRAFFIC
      # =========================================================

      - name: Verify service selector
        shell: bash
        run: |

          set -e

          ACTIVE_COLOR=$(kubectl get svc payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.selector.color}')

          echo ""
          echo "=========================================="
          echo "TRAFFIC VERIFICATION"
          echo "=========================================="

          echo "Expected color: ${TARGET_COLOR}"
          echo "Actual color  : ${ACTIVE_COLOR}"

          if [[ "${SWITCH_TRAFFIC}" == "yes" ]]; then

            if [[ "${ACTIVE_COLOR}" != "${TARGET_COLOR}" ]]; then

              echo "ERROR: Traffic is NOT pointing to ${TARGET_COLOR}"

              exit 1

            fi

            echo "Traffic successfully switched to ${TARGET_COLOR}."

          else

            echo "Traffic switch was not requested."

          fi

      # =========================================================
      # 16. FINAL STATUS
      # =========================================================

      - name: Final status
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "BLUE-GREEN DEPLOYMENT COMPLETE"
          echo "=========================================="

          echo "Environment : ${ENVIRONMENT}"
          echo "Image       : ${IMAGE_TAG}"
          echo "Active Color: ${TARGET_COLOR}"
          echo "Traffic     : ${SWITCH_TRAFFIC}"

          echo ""

          kubectl get svc payment-service \
            -n "${NAMESPACE}" \
            -o jsonpath='Service selector: {.spec.selector}{"\n"}'

          echo ""

          kubectl get deployments \
            -n "${NAMESPACE}" \
            -o wide

          echo ""
          echo "Deployment completed successfully."
