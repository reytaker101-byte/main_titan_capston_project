name: 06 - Promote to Production Pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image tag approved from Stage
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-blue-green.yaml
    with:
      namespace: payment-prod-pilot
      replicas: 2
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
