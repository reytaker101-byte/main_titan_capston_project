name: 02 - Build Push and Deploy DEV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional release tag; leave blank to generate a commit SHA tag"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: main-titan-capston-project-artifactory-repo

jobs:
  build-and-push:
    name: Build and Push Payment Service
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate image tag
        id: tag
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          RELEASE_TAG="$(printf '%s' "$INPUT_IMAGE_TAG" | xargs)"

          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag. Expected v<major>.<minor>.<patch>"
              exit 1
            fi
            IMAGE_TAG="$RELEASE_TAG"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Selected image tag: $IMAGE_TAG"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build Payment Service image
        shell: bash
        run: |
          set -euo pipefail

          GAR_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${IMAGE_TAG}"
          GAR_SHA_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:sha-${GITHUB_SHA::7}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "$GAR_IMAGE" \
            -t "$GAR_SHA_IMAGE" \
            ./services/payment-service

          docker push "$GAR_IMAGE"
          docker push "$GAR_SHA_IMAGE"

      - name: Verify Payment Service image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/dev/payment-service:${IMAGE_TAG}"

          DIGEST="$(gcloud artifacts docker images describe \
            "$IMAGE" \
            --format='value(image_summary.digest)')"

          if [[ -z "$DIGEST" ]]; then
            echo "::error::Image verification failed"
            exit 1
          fi

          echo "Image verified: $IMAGE"
          echo "Digest: $DIGEST"

  deploy-dev:
    name: Update DEV GitOps
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::Image tag output is empty"
            exit 1
          fi

          echo "Deploying image tag: $IMAGE_TAG"

      - name: Update DEV Helm values
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="devops-infra/kubernetes/payment-service/helm/values-dev.yaml"

          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::DEV values file not found: $VALUES_FILE"
            exit 1
          fi

          IMAGE_TAG="$IMAGE_TAG" python3 - "$VALUES_FILE" <<'PY'
          import os
          import re
          import sys

          path = sys.argv[1]
          tag = os.environ["IMAGE_TAG"]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          pattern = r"(?ms)(^image:\s*\n(?:(?!^\S).*\n)*?^[ \t]+tag:\s*).*$"

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + tag,
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not uniquely update image.tag in DEV values file")

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Updated DEV image tag to {tag}")
          PY

          grep -A 3 '^image:' "$VALUES_FILE"

      - name: Commit GitOps change
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            devops-infra/kubernetes/payment-service/helm/values-dev.yaml

          if git diff --cached --quiet; then
            echo "DEV already uses ${IMAGE_TAG}"
            exit 0
          fi

          git commit -m "deploy: Payment Service DEV ${IMAGE_TAG}"
          git push origin HEAD:main

      - name: Deployment summary
        run: |
          {
            echo "## DEV GitOps Update"
            echo ""
            echo "- Image tag: ${IMAGE_TAG}"
            echo "- Environment: DEV"
            echo "- GitOps file: devops-infra/kubernetes/payment-service/helm/values-dev.yaml"
            echo "- Argo CD will reconcile the Git change."
          } >> "$GITHUB_STEP_SUMMARY"
